<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Paysbillz - Data & Airtime</title>
    <style>
        /* ===== CSS VARIABLES (THEME) ===== */
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --bg-input: rgba(0, 0, 0, 0.3);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #ecf3ff;
            --text-secondary: #b8c7e6;
            --text-muted: #5a6f8a;
            --text-dim: #2a3f55;
            --gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #f7971e, #ffd200);
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --transaction-bg: rgba(255, 255, 255, 0.03);
            --transaction-hover: rgba(255, 255, 255, 0.06);
            /* Validity colors */
            --daily-color: #4ecdc4;
            --weekly-color: #ffd93d;
            --monthly-color: #6bcb77;
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-primary: #f0f4fa;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-card-hover: rgba(0, 0, 0, 0.06);
            --bg-input: rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1a2e;
            --text-secondary: #3a4a5e;
            --text-muted: #7a8a9e;
            --text-dim: #c0d0e0;
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --transaction-bg: rgba(0, 0, 0, 0.02);
            --transaction-hover: rgba(0, 0, 0, 0.04);
            --daily-color: #2ecc71;
            --weekly-color: #f39c12;
            --monthly-color: #3498db;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 25px 12px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 32px;
            padding: 28px 22px 38px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left h1 {
            font-size: 32px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-left .sub {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            flex-wrap: wrap;
        }

        .header-left .sub .phone-badge {
            background: rgba(255, 215, 0, 0.12);
            padding: 2px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: var(--gold);
            font-weight: 500;
            font-size: 13px;
            -webkit-text-fill-color: var(--gold);
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Theme Toggle */
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold);
        }

        .theme-toggle .toggle-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ===== VALIDITY FILTER TABS ===== */
        .filter-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 20px 0 18px 0;
            justify-content: center;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.3px;
        }

        .filter-btn:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.25);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--gold-gradient);
            color: #0f0f1a;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25);
        }

        /* ===== PLANS GRID ===== */
        .plans-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        @media (max-width: 540px) {
            .plans-grid {
                grid-template-columns: 1fr;
            }
        }

        .plan-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px 16px 14px;
            border: 1px solid var(--border-color);
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .plan-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            transition: 0.3s;
        }

        .plan-card.validity-daily::before {
            background: var(--daily-color);
        }

        .plan-card.validity-weekly::before {
            background: var(--weekly-color);
        }

        .plan-card.validity-monthly::before {
            background: var(--monthly-color);
        }

        .plan-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 215, 0, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .plan-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .plan-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .plan-name small {
            font-weight: 400;
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .plan-badge {
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .plan-badge.daily {
            background: rgba(78, 205, 196, 0.15);
            color: var(--daily-color);
            border: 1px solid rgba(78, 205, 196, 0.2);
        }

        .plan-badge.weekly {
            background: rgba(255, 217, 61, 0.15);
            color: var(--weekly-color);
            border: 1px solid rgba(255, 217, 61, 0.2);
        }

        .plan-badge.monthly {
            background: rgba(107, 203, 119, 0.15);
            color: var(--monthly-color);
            border: 1px solid rgba(107, 203, 119, 0.2);
        }

        .plan-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .plan-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
        }

        .plan-price small {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .buy-btn {
            background: var(--gold-gradient);
            border: none;
            color: #0f0f1a;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.3px;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }

        .plan-network-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        /* ===== AIRTIME SECTION ===== */
        .airtime-section {
            margin-top: 35px;
            background: var(--glass-bg);
            border-radius: 24px;
            padding: 24px 20px;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border 0.3s;
        }

        .airtime-section h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .airtime-section h2 span {
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            color: var(--gold);
            font-weight: 500;
        }

        .airtime-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 480px) {
            .airtime-grid {
                grid-template-columns: 1fr;
            }
        }

        .airtime-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .airtime-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .airtime-group select,
        .airtime-group input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }

        .airtime-group select:focus,
        .airtime-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.08);
        }

        .airtime-group select option {
            background: var(--bg-secondary);
        }

        .airtime-group input::placeholder {
            color: var(--text-muted);
        }

        .buy-airtime-btn {
            grid-column: 1 / -1;
            background: var(--gold-gradient);
            border: none;
            color: #0f0f1a;
            font-weight: 700;
            font-size: 17px;
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .buy-airtime-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.25);
        }

        /* ===== RECENT / TRANSACTIONS ===== */
        .recent-section {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 22px;
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .recent-header h3 {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recent-header h3 span {
            background: rgba(255, 215, 0, 0.1);
            padding: 0 12px;
            border-radius: 40px;
            font-size: 12px;
            color: var(--gold);
        }

        .transaction-list {
            max-height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }

        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }

        .transaction-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .transaction-list::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        .transaction-item {
            background: var(--transaction-bg);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
            transition: 0.2s;
            flex-wrap: wrap;
            gap: 6px;
        }

        .transaction-item:hover {
            background: var(--transaction-hover);
        }

        .transaction-item.data {
            border-left-color: #4ecdc4;
        }

        .transaction-item.airtime {
            border-left-color: #ffd700;
        }

        .transaction-left {
            display: flex;
            flex-direction: column;
        }

        .transaction-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }

        .transaction-detail {
            font-size: 12px;
            color: var(--text-muted);
        }

        .transaction-right {
            text-align: right;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 16px;
            color: var(--gold);
        }

        .transaction-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .empty-transactions {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 14px;
        }

        .empty-transactions .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-left: 4px solid #4ecdc4;
        }

        .toast.error {
            border-left: 4px solid #ff6b6b;
        }

        /* ===== NETWORK BADGE ===== */
        .network-badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .network-badge.mtn {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
        }

        .network-badge.airtel {
            background: rgba(255, 0, 0, 0.15);
            color: #ff4444;
        }

        .network-badge.glo {
            background: rgba(0, 150, 255, 0.15);
            color: #0096ff;
        }

        .network-badge.nine {
            background: rgba(156, 39, 176, 0.15);
            color: #9c27b0;
        }
    </style>
</head>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-left">

    <div class="airtime-section">

        <div class="airtime-grid">

                    <option value="Airtel">📶 Airtel</option>
                    <option value="GLO">📶 GLO</option>
                    <option value="9mobile">📶 9mobile</option>
                </select>
            </div>
            <div class="airtime-group">
                <label>Amount (₦)</label>
                <input type="number" id="airtimeAmount" placeholder="100, 500, 1000" min="50" step="50" />
            </div>
            <div class="airtime-group" style="grid-column: 1 / -1;">
                <label>Phone Number</label>
                <input type="tel" id="airtimePhone" placeholder="080xxxxxxxx" />
            </div>
            <button class="buy-airtime-btn" onclick="buyAirtime()">🚀 Purchase Airtime</button>
        </div>
    </div>

    <!-- ===== RECENT / TRANSACTIONS ===== -->
    <div class="recent-section">
        <div class="recent-header">
            <h3>📋 Recent Transactions <span id="txCount">0</span></h3>
        </div>
        <div class="transaction-list" id="transactionList">
            <div class="empty-transactions">
                <span class="emoji">🛒</span>
                No transactions yet.<br />Buy data or airtime to get started!
            </div>
        </div>
    </div>

</div>

        { id: 'm34', name: 'MTN GIFT 10GB', validity: 'Monthly', price: 5000, network: 'MTN' },
    ];

    // ============================================================
    // 2. TRANSACTION HISTORY (localStorage)
    // ============================================================
    function getTransactions() {
        try {
            return JSON.parse(localStorage.getItem('paysbillz_transactions')) || [];
        } catch {
            return [];
        }
    }

    function saveTransactions(txs) {
        localStorage.setItem('paysbillz_transactions', JSON.stringify(txs));
    }

    function addTransaction(type, name, amount, detail = '') {
        const txs = getTransactions();
        txs.unshift({
            id: Date.now(),
            type: type,
            name: name,
            amount: amount,
            detail: detail,
            time: new Date().toLocaleString()
        });
        if (txs.length > 50) txs.pop();
        saveTransactions(txs);
        renderTransactions();
        updateTxCount();
    }

    function clearHistory() {
        if (confirm('Clear all transaction history?')) {
            saveTransactions([]);
            renderTransactions();
            updateTxCount();
            showToast('🗑️ History cleared', 'success');
        }
    }

    function updateTxCount() {
        const txs = getTransactions();
        document.getElementById('txCount').textContent = txs.length;
    }

    // ============================================================
    // 3. RENDER TRANSACTIONS
    // ============================================================
    function renderTransactions() {
        const txs = getTransactions();
        const container = document.getElementById('transactionList');

        if (txs.length === 0) {
            container.innerHTML = `
                <div class="empty-transactions">
                    <span class="emoji">🛒</span>
                    No transactions yet.<br />Buy data or airtime to get started!
                </div>
            `;
            return;
        }

        container.innerHTML = txs.map(tx => `
            <div class="transaction-item ${tx.type}">
                <div class="transaction-left">
                    <span class="transaction-name">${tx.name}</span>
                    <span class="transaction-detail">${tx.detail || ''}</span>
                </div>
                <div class="transaction-right">
                    <div class="transaction-amount">₦${tx.amount.toLocaleString()}</div>
                    <div class="transaction-time">${tx.time}</div>
                </div>
            </div>
        `).join('');
    }

    // ============================================================
    // 4. RENDER PLANS WITH VALIDITY FILTER
    // ============================================================
    const grid = document.getElementById('plansGrid');

    function getValidityClass(validity) {
        return validity.toLowerCase();
    }

    function getBadgeClass(validity) {
        return validity.toLowerCase();
    }

    function getNetworkClass(network) {
        const map = {
            'MTN': 'mtn',
            'Airtel': 'airtel',
            'GLO': 'glo',
            '9mobile': 'nine'
        };
        return map[network] || '';
    }

    function renderPlans(filter = 'all') {
        let filtered = allPlans;
        if (filter !== 'all') {
            filtered = allPlans.filter(p => p.validity.toLowerCase() === filter);
        }

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 0;">
                    No ${filter} plans available yet.
                </div>
            `;
            return;
        }

        grid.innerHTML = filtered.map(p => {
            const vc = getValidityClass(p.validity);
            const bc = getBadgeClass(p.validity);
            const nc = getNetworkClass(p.network);
            return `
                <div class="plan-card validity-${vc}">
                    <div class="plan-top">
                        <div class="plan-name">
                            ${p.name}
                            <small>
                                <span class="network-badge ${nc}">${p.network}</span>
                                • ${p.validity}
                            </small>
                        </div>
                        <span class="plan-badge ${bc}">${p.validity}</span>
                    </div>
                    <div class="plan-bottom">
                        <span class="plan-price">₦${p.price.toLocaleString()}</span>
                        <button class="buy-btn" onclick="buyPlan('${p.name}', ${p.price}, '${p.network}', '${p.validity}')">Buy</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // 5. BUY FUNCTIONS
    // ============================================================
    function buyPlan(name, price, network, validity) {
        if (confirm(`✅ Confirm purchase:\n📦 ${name}\n💰 ₦${price.toLocaleString()}\n📡 ${network}\n⏱ ${validity}\n\nProceed?`)) {
            addTransaction('data', name, price, `📡 ${network} · ${validity}`);
            showToast(`✅ ${name} purchased for ₦${price.toLocaleString()}`, 'success');
        }
    }

    function buyAirtime() {
        const network = document.getElementById('networkSelect').value;
        const amount = document.getElementById('airtimeAmount').value.trim();
        const phone = document.getElementById('airtimePhone').value.trim();

        if (!amount || isNaN(amount) || Number(amount) < 50) {
            showToast('⚠️ Please enter a valid amount (₦50 minimum).', 'error');
            return;
        }

        if (!phone || phone.length < 10) {
            showToast('⚠️ Please enter a valid phone number (e.g. 08012345678).', 'error');
            return;
        }

        if (confirm(`✅ Confirm airtime purchase:\n📱 ${network}\n💰 ₦${amount}\n📞 ${phone}\n\nProceed?`)) {
            addTransaction('airtime', `${network} Airtime`, Number(amount), `📞 ${phone}`);
            showToast(`✅ ${network} airtime of ₦${amount} sent to ${phone}`, 'success');
            document.getElementById('airtimeAmount').value = '';
            document.getElementById('airtimePhone').value = '';
        }
    }

    // ============================================================
    // 6. TOAST NOTIFICATION
    // ============================================================
    let toastTimeout;

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type;
        void toast.offsetWidth;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    // ============================================================
    // 7. THEME TOGGLE
    // ============================================================
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const newTheme = current === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);

        const icon = document.getElementById('themeIcon');
        const label = document.getElementById('themeLabel');
        if (newTheme === 'light') {
            icon.textContent = '☀️';
            label.textContent = 'Light';
        } else {
            icon.textContent = '🌙';
            label.textContent = 'Dark';
        }
        localStorage.setItem('paysbillz_theme', newTheme);
    }

    function loadTheme() {
        const saved = localStorage.getItem('paysbillz_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        const icon = document.getElementById('themeIcon');
        const label = document.getElementById('themeLabel');
        if (saved === 'light') {
            icon.textContent = '☀️';
            label.textContent = 'Light';
        } else {
            icon.textContent = '🌙';
            label.textContent = 'Dark';
        }
    }

    // ============================================================
    // 8. FILTER TABS
    // ============================================================
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderPlans(this.dataset.filter);
        });
    });

    // ============================================================
    // 9. LOAD USER PHONE
    // ============================================================
    function loadUserPhone() {
        const phone = localStorage.getItem('userPhone') || '08027449527';
        document.getElementById('phoneBadge').textContent = '📞 ' + phone;
    }

    // ============================================================
    // 10. ENTER KEY SUPPORT
    // ============================================================
    document.getElementById('airtimeAmount').addEventListener('keypress', e => { if (e.key === 'Enter') buyAirtime(); });
    document.getElementById('airtimePhone').addEventListener('keypress', e => { if (e.key === 'Enter') buyAirtime(); });

    // ============================================================
    // 11. INIT
    // ============================================================
    loadTheme();
    loadUserPhone();
    renderPlans('all');
    renderTransactions();
    updateTxCount();
</script>
