<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Paysbillz - Dashboard</title>
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --bg-input: rgba(0, 0, 0, 0.3);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #ecf3ff;
            --text-secondary: #b8c7e6;
            --text-muted: #5a6f8a;
            --gold: #ffd700;
            --gold-gradient: linear-gradient(135deg, #f7971e, #ffd200);
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --transaction-bg: rgba(255, 255, 255, 0.03);
            --transaction-hover: rgba(255, 255, 255, 0.06);
            --daily-color: #4ecdc4;
            --weekly-color: #ffd93d;
            --monthly-color: #6bcb77;
            --accent: #4ecdc4;
            --support-color: #25D366;
        }

        [data-theme="light"] {
            --bg-primary: #f0f4fa;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-card-hover: rgba(0, 0, 0, 0.06);
            --bg-input: rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1a2e;
            --text-secondary: #3a4a5e;
            --text-muted: #7a8a9e;
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --transaction-bg: rgba(0, 0, 0, 0.02);
            --transaction-hover: rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 25px 12px;
            transition: background 0.3s;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 32px;
            padding: 28px 22px 38px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background 0.3s;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-left .sub {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            flex-wrap: wrap;
        }

        .header-left .sub .badge {
            background: rgba(255, 215, 0, 0.12);
            padding: 2px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: var(--gold);
            font-weight: 500;
            font-size: 12px;
            -webkit-text-fill-color: var(--gold);
        }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-toggle, .logout-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.25s;
        }

        .theme-toggle:hover { background: var(--bg-card-hover); border-color: var(--gold); }
        .logout-btn:hover { background: rgba(255, 50, 50, 0.15); border-color: #ff6b6b; color: #ff6b6b; }

        /* ===== BALANCE CARDS ===== */
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }

        @media (max-width: 480px) {
            .balance-grid { grid-template-columns: 1fr 1fr; }
        }

        .balance-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            transition: 0.25s;
        }

        .balance-card:hover { background: var(--bg-card-hover); }

        .balance-card .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-card .amount {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
            margin-top: 4px;
        }

        .balance-card .amount.wallet { color: #4ecdc4; }
        .balance-card .amount.profit { color: #ffd93d; }

        /* ===== VIRTUAL ACCOUNT CARD ===== */
        .virtual-account-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            cursor: pointer;
            transition: 0.25s;
            border-left: 3px solid var(--gold);
        }

        .virtual-account-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold);
        }

        .virtual-account-card .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .virtual-account-card .account-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .virtual-account-card .bank-name {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .virtual-account-card .copy-btn {
            background: var(--gold-gradient);
            border: none;
            color: #0f0f1a;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.25s;
        }

        .virtual-account-card .copy-btn:hover {
            transform: scale(1.05);
        }

        /* ===== KYC STATUS ===== */
        .kyc-status {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .kyc-status .tier-badge {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }

        .kyc-status .tier-badge.tier1 { background: rgba(158, 158, 158, 0.2); color: #9e9e9e; }
        .kyc-status .tier-badge.tier2 { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
        .kyc-status .tier-badge.tier3 { background: rgba(255, 215, 0, 0.2); color: var(--gold); }

        .kyc-status .status-badge.verified { color: #4caf50; }
        .kyc-status .status-badge.pending { color: #ff9800; }
        .kyc-status .status-badge.not_submitted { color: #f44336; }

        /* ===== SERVICE BUTTONS ===== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 16px 0;
        }

        @media (max-width: 480px) {
            .services-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .service-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            color: var(--text-secondary);
        }

        .service-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold);
            transform: translateY(-2px);
            color: var(--text-primary);
        }

        .service-btn .icon { font-size: 28px; display: block; margin-bottom: 4px; }
        .service-btn .name { font-size: 10px; font-weight: 600; }

        .service-btn.primary { background: var(--gold-gradient); color: #0f0f1a; border-color: transparent; }
        .service-btn.primary:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25); }
        .service-btn.fingerprint { background: rgba(78, 205, 196, 0.15); border-color: rgba(78, 205, 196, 0.2); }
        .service-btn.kyc-btn { background: rgba(255, 215, 0, 0.08); border-color: rgba(255, 215, 0, 0.15); }
        .service-btn.pin-btn { background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.2); }
        .service-btn.support-btn { background: rgba(78, 205, 196, 0.15); border-color: rgba(78, 205, 196, 0.3); }

        /* ===== FILTER TABS ===== */
        .filter-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 16px 0 14px;
            justify-content: center;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: 0.25s;
        }

        .filter-btn:hover { background: rgba(255, 215, 0, 0.08); border-color: rgba(255, 215, 0, 0.25); color: var(--text-primary); }
        .filter-btn.active { background: var(--gold-gradient); color: #0f0f1a; border-color: transparent; box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25); }

        /* ===== PLANS GRID ===== */
        .plans-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        @media (max-width: 540px) { .plans-grid { grid-template-columns: 1fr; } }

        .plan-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--border-color);
            transition: 0.25s;
            position: relative;
            overflow: hidden;
        }

        .plan-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            transition: 0.3s;
        }
        .plan-card.validity-daily::before { background: var(--daily-color); }
        .plan-card.validity-weekly::before { background: var(--weekly-color); }
        .plan-card.validity-monthly::before { background: var(--monthly-color); }

        .plan-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 215, 0, 0.15);
            transform: translateY(-2px);
        }

        .plan-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .plan-name { font-weight: 600; font-size: 13px; color: var(--text-primary); line-height: 1.3; }
        .plan-name small { font-weight: 400; font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }

        .plan-badge {
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .plan-badge.daily { background: rgba(78, 205, 196, 0.15); color: var(--daily-color); border: 1px solid rgba(78, 205, 196, 0.2); }
        .plan-badge.weekly { background: rgba(255, 217, 61, 0.15); color: var(--weekly-color); border: 1px solid rgba(255, 217, 61, 0.2); }
        .plan-badge.monthly { background: rgba(107, 203, 119, 0.15); color: var(--monthly-color); border: 1px solid rgba(107, 203, 119, 0.2); }

        .plan-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .plan-price { font-size: 18px; font-weight: 700; color: var(--gold); }
        .plan-price small { font-size: 12px; font-weight: 400; color: var(--text-muted); }

        .buy-btn {
            background: var(--gold-gradient);
            border: none;
            color: #0f0f1a;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s;
        }
        .buy-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3); }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.show { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h2 { color: var(--text-primary); font-size: 20px; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            padding: 0 8px;
        }
        .modal-close:hover { color: var(--text-primary); }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .modal-content input:focus, .modal-content select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.08);
        }
        .modal-content input::placeholder { color: var(--text-muted); }

        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 8px;
            background: var(--gold-gradient);
            color: #0f0f1a;
        }
        .modal-btn:hover { transform: scale(1.02); box-shadow: 0 6px 30px rgba(255, 215, 0, 0.25); }
        .modal-btn.success { background: #2e7d32; color: #fff; }
        .modal-btn.danger { background: #d32f2f; color: #fff; }
        .modal-btn.support { background: #25D366; color: #fff; }
        .modal-btn.support:hover { background: #1da851; }

        .result-msg {
            margin-top: 10px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .result-msg.show { display: block; }
        .result-msg.success { background: rgba(46, 125, 50, 0.15); color: #4caf50; border: 1px solid rgba(46, 125, 50, 0.2); }
        .result-msg.error { background: rgba(211, 47, 47, 0.15); color: #ef5350; border: 1px solid rgba(211, 47, 47, 0.2); }
        .result-msg.loading { background: rgba(255, 215, 0, 0.1); color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.15); }

        /* ===== TRANSACTIONS ===== */
        .recent-section {
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 18px;
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .recent-header h3 { color: var(--text-primary); font-size: 15px; font-weight: 700; }
        .recent-header h3 span { background: rgba(255, 215, 0, 0.1); padding: 0 12px; border-radius: 40px; font-size: 12px; color: var(--gold); }

        .transaction-list { max-height: 250px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }
        .transaction-list::-webkit-scrollbar { width: 4px; }
        .transaction-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .transaction-item {
            background: var(--transaction-bg);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
            transition: 0.2s;
            flex-wrap: wrap;
            gap: 4px;
        }
        .transaction-item:hover { background: var(--transaction-hover); }
        .transaction-item.data { border-left-color: #4ecdc4; }
        .transaction-item.airtime { border-left-color: #ffd700; }
        .transaction-item.tv { border-left-color: #9c27b0; }
        .transaction-item.electricity { border-left-color: #ff9800; }
        .transaction-item.education { border-left-color: #2196f3; }
        .transaction-item.funding { border-left-color: #4caf50; }
        .transaction-item.withdrawal { border-left-color: #f44336; }
        .transaction-item.virtual_account_funding { border-left-color: #9c27b0; }

        .transaction-name { font-weight: 600; font-size: 13px; color: var(--text-primary); }
        .transaction-detail { font-size: 11px; color: var(--text-muted); }
        .transaction-amount { font-weight: 700; font-size: 15px; color: var(--gold); }
        .transaction-time { font-size: 10px; color: var(--text-muted); }
        .profit-badge { background: rgba(255, 215, 0, 0.1); color: var(--gold); padding: 1px 8px; border-radius: 8px; font-size: 9px; }

        .empty-transactions { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 14px; }
        .empty-transactions .emoji { font-size: 32px; display: block; margin-bottom: 8px; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-left: 4px solid #4ecdc4; }
        .toast.error { border-left: 4px solid #ff6b6b; }

        /* ===== PAYSTACK FUNDING ===== */
        .paystack-info {
            background: rgba(78, 205, 196, 0.05);
            border: 1px solid rgba(78, 205, 196, 0.15);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }

        .paystack-info .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .paystack-info .step .num {
            background: var(--gold-gradient);
            color: #0f0f1a;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
        }

        .paystack-badge {
            display: inline-block;
            background: #4ecdc4;
            color: #0f0f1a;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
        }

        .fingerprint-btn {
            background: var(--bg-card);
            border: 2px solid var(--accent);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .fingerprint-btn:hover {
            background: rgba(78, 205, 196, 0.1);
            border-color: var(--gold);
        }

        .fingerprint-btn .icon-large {
            font-size: 32px;
        }

        .fingerprint-btn.scanning {
            animation: pulse 1s infinite;
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* ===== SUPPORT CHAT ===== */
        .chat-messages {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .chat-message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 90%;
        }

        .chat-message.bot {
            background: rgba(78, 205, 196, 0.1);
            color: var(--text-primary);
            border-left: 3px solid var(--accent);
        }

        .chat-message.user {
            background: rgba(255, 215, 0, 0.1);
            color: var(--text-primary);
            border-left: 3px solid var(--gold);
            margin-left: auto;
        }

        .chat-suggestion {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.25s;
        }

        .chat-suggestion:hover {
            background: rgba(78, 205, 196, 0.1);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .support-contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .support-contact-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            transition: 0.25s;
        }

        .support-contact-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--gold);
        }

        .support-contact-item .icon-large {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .support-contact-item .label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

// ============================================================
// TRANSACTIONS - FIXED with safe fallbacks
// ============================================================
function getTransactions() {
    try { 
        var data = localStorage.getItem('paysbillz_transactions');
        return data ? JSON.parse(data) : [];
    } catch (e) { 
        return []; 
    }
}

function saveTransactions(txs) {
    localStorage.setItem('paysbillz_transactions', JSON.stringify(txs));
}

function addTransaction(type, name, amount, detail, profit) {
    if (amount === undefined || amount === null) amount = 0;
    if (profit === undefined || profit === null) profit = 0;
    
    var txs = getTransactions();
    txs.unshift({ 
        id: Date.now(), 
        type: type || 'unknown', 
        name: name || 'Transaction', 
        amount: Number(amount) || 0, 
        detail: detail || '', 
        profit: Number(profit) || 0, 
        time: new Date().toLocaleString() 
    });
    if (txs.length > 100) txs.pop();
    saveTransactions(txs);
    renderTransactions();
    updateTxCount();
}

// ============================================================
// RENDER FUNCTIONS - FIXED with safe fallbacks
// ============================================================
function renderTransactions() {
    var txs = getTransactions();
    var container = document.getElementById('transactionList');
    if (!txs || txs.length === 0) {
        container.innerHTML = '<div class="empty-transactions"><span class="emoji">🛒</span>No transactions yet.</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < txs.length; i++) {
        var tx = txs[i];
        var amount = Number(tx.amount || 0);
        var profit = Number(tx.profit || 0);
        html += '<div class="transaction-item ' + (tx.type || 'unknown') + '">';
        html += '<div><div class="transaction-name">' + (tx.name || 'Transaction') + '</div>';
        html += '<div class="transaction-detail">' + (tx.detail || '') + '</div></div>';
        html += '<div style="text-align:right;">';
        html += '<div class="transaction-amount">₦' + amount.toLocaleString() + '</div>';
        if (profit > 0) {
            html += '<div class="profit-badge">+₦' + profit.toFixed(2) + '</div>';
        }
        html += '<div class="transaction-time">' + (tx.time || '') + '</div>';
        html += '</div></div>';
    }
    container.innerHTML = html;
}

function updateTxCount() {
    var txs = getTransactions();
    var count = (txs && txs.length) || 0;
    document.getElementById('txCount').textContent = count;
    document.getElementById('txnCount').textContent = count;
}

// ============================================================
// RENDER PLANS
// ============================================================
function renderPlans(filter) {
    if (filter === undefined) filter = 'all';
    var grid = document.getElementById('plansGrid');
    var filtered = [];
    
    if (filter === 'small') {
        for (var i = 0; i < allPlans.length; i++) {
            if (allPlans[i].price <= 100) filtered.push(allPlans[i]);
        }
    } else if (filter === 'all') {
        filtered = allPlans;
    } else {
        for (var j = 0; j < allPlans.length; j++) {
            if (allPlans[j].validity.toLowerCase() === filter) filtered.push(allPlans[j]);
        }
    }
    
    if (!filtered || filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">No ' + filter + ' plans available.</div>';
        return;
    }

// ============================================================
// TRANSACTION PIN FUNCTIONS
// ============================================================
function setTransactionPin() {
    var pin1 = document.getElementById('transactionPin1').value.trim();
    var pin2 = document.getElementById('transactionPin2').value.trim();
    
    if (!pin1 || pin1.length !== 4 || !/^\d{4}$/.test(pin1)) {
        showResult('error', '⚠️ Please enter a valid 4-digit PIN (numbers only)');
        return;
    }
    
    if (pin1 !== pin2) {
        showResult('error', '⚠️ PINs do not match');
        return;
    }
    
    localStorage.setItem('transactionPin', pin1);
    showResult('success', '✅ Transaction PIN set successfully!');
    showToast('✅ Transaction PIN set!', 'success');
    setTimeout(function() { closeModal(); }, 1500);
}

function verifyTransactionPin() {
    var storedPin = localStorage.getItem('transactionPin');
    if (!storedPin) {
        showResult('error', '⚠️ No PIN set. Please set a transaction PIN first.');
        return;
    }
    
    var enteredPin = prompt('🔐 Enter your 4-digit transaction PIN:');
    if (!enteredPin) return;
    
    if (enteredPin === storedPin) {
        showResult('success', '✅ PIN verified!');
        showToast('✅ PIN verified!', 'success');
    } else {
        showResult('error', '❌ Incorrect PIN. Please try again.');
    }
}

function requireTransactionPin() {
    var storedPin = localStorage.getItem('transactionPin');
    if (!storedPin) return true;
    
    var enteredPin = prompt('🔐 Enter your transaction PIN:');
    if (!enteredPin) return false;
    
    if (enteredPin === storedPin) {
        return true;
    } else {
        showToast('❌ Incorrect PIN. Transaction cancelled.', 'error');
        return false;
    }
}

// ============================================================
// BUY FUNCTIONS
// ============================================================
async function buyDataPlan(planId) {
    var plan = null;
    for (var i = 0; i < allPlans.length; i++) {
        if (allPlans[i].id === planId) {
            plan = allPlans[i];
            break;
        }
    }
    if (!plan) return;
    
    if (!requireTransactionPin()) return;
    
    if (!confirm('Confirm purchase: ' + plan.name + ' - ₦' + plan.price + '?')) return;
    showResult('loading', '⏳ Processing...');
    try {
        var res = await fetch(API + '/api/buy-data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: userPhone, plan: planId })
        });
        var data = await res.json();
        if (data.success) {
            var profit = data.result?.profit || plan.profit || 0;
            addTransaction('data', plan.name, plan.price, '📡 ' + plan.network, profit);
            showToast('✅ ' + plan.name + ' purchased!', 'success');
            closeModal();
            loadBalance();
        } else {
            showResult('error', '❌ ' + (data.error || 'Purchase failed'));
        }
    } catch (err) {
        showResult('error', '❌ ' + err.message);
    }
}

function copyAccountNumber() {
    var accountNumber = document.getElementById('virtualAccountDisplay').textContent;
    if (accountNumber && accountNumber !== 'Loading...') {
        navigator.clipboard.writeText(accountNumber).then(function() {
            showToast('✅ Account number copied!', 'success');
        }).catch(function() {
            var input = document.createElement('input');
            input.value = accountNumber;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast('✅ Account number copied!', 'success');
        });
    }
}

function renderModalPlans(filter) {
    var container = document.getElementById('modalPlansGrid');
    if (!container) return;
    var filtered = [];
    
    if (filter === 'small') {
        for (var i = 0; i < allPlans.length; i++) {
            if (allPlans[i].price <= 100) filtered.push(allPlans[i]);
        }
    } else if (filter === 'all') {
        filtered = allPlans;
    } else {
        for (var j = 0; j < allPlans.length; j++) {
            if (allPlans[j].validity.toLowerCase() === filter) filtered.push(allPlans[j]);
        }
    }
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">No plans found</div>';
        return;
    }
    
    var html = '';
    for (var k = 0; k < filtered.length; k++) {
        var p = filtered[k];
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-card);border-radius:12px;margin-bottom:6px;border:1px solid var(--border-color);">';
        html += '<div><div style="font-weight:600;color:var(--text-primary);font-size:13px;">' + p.name + '</div>';
        html += '<div style="font-size:11px;color:var(--text-muted);">' + p.network + ' · ' + p.validity + '</div></div>';
        html += '<div style="display:flex;align-items:center;gap:10px;">';
        html += '<span style="font-weight:700;color:var(--gold);font-size:14px;">₦' + p.price.toLocaleString() + '</span>';
        html += '<button class="buy-btn" onclick="buyDataPlan(\'' + p.id + '\')" style="padding:4px 14px;font-size:11px;">Buy</button>';
        html += '</div></div>';
    }
    container.innerHTML = html;
}

// ============================================================
// TOAST NOTIFICATION
// ============================================================
var toastTimeout;

function showToast(message, type) {
    if (type === undefined) type = 'success';
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type;
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function() { toast.classList.remove('show'); }, 4000);
}

// ============================================================
// THEME TOGGLE
// ============================================================
function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var newTheme = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    document.getElementById('themeIcon').textContent = newTheme === 'light' ? '☀️' : '🌙';
    localStorage.setItem('paysbillz_theme', newTheme);
}

function loadTheme() {
    var saved = localStorage.getItem('paysbillz_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeIcon').textContent = saved === 'light' ? '☀️' : '🌙';
}
