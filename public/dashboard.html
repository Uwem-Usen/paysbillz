<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <h1>Dashboard</h1>
    <div id="status">Loading...</div>
    <div id="plans"></div>
    <script>
        async function loadData() {
            const status = document.getElementById('status');
            const plansDiv = document.getElementById('plans');
            
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }
                
                status.innerHTML = 'Fetching plans...';
                
                const response = await fetch('/api/vtu/data-plans', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                status.innerHTML = '✅ Loaded ' + (data.total || 0) + ' plans';
                
                let html = '';
                const plans = data.data || {};
                Object.keys(plans).forEach(network => {
                    plans[network].forEach(plan => {
                        html += '<div style="border:1px solid #ddd;padding:10px;margin:5px;">';
                        html += '<strong>' + plan.name + '</strong><br>';
                        html += 'Price: ₦' + plan.price + '<br>';
                        html += 'Provider: ' + plan.provider + '<br>';
                        html += '<button onclick="buy(\'' + plan.serviceID + '\')">Buy Now</button>';
                        html += '</div>';
                    });
                });
                plansDiv.innerHTML = html;
                
            } catch (error) {
                status.innerHTML = '❌ Error: ' + error.message;
            }
        }
        
        async function buy(serviceID) {
            const phone = prompt('Enter phone number:');
            if (!phone) return;
            
            const token = localStorage.getItem('token');
            const response = await fetch('/api/vtu/buy-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ serviceID, phoneNumber: phone })
            });
            const result = await response.json();
            alert(result.success ? '✅ Success!' : '❌ ' + result.message);
        }
        
        loadData();
    </script>
</body>
</html>
