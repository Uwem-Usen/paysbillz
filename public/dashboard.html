        .service-card .icon { font-size: 30px; }

        .network-tab { padding: 8px 20px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; background: white; font-weight: 600; }
        .network-tab.active { background: #1976d2; color: white; border-color: #1976d2; }
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .plan-card .provider-badge.strongmb { background: #f3e5f5; color: #4a148c; }

                    fields: '<div class="form-group"><label>Provider</label><select id="tvProvider"><option value="DStv">DStv</option><option value="GOtv">GOtv</option><option value="StarTimes">StarTimes</option></select></div><div class="form-group"><label>Smart Card Number</label><input type="text" id="tvSmartCard" placeholder="Enter smart card number"></div><div class="form-group"><label>Package</label><select id="tvPackage"><option value="Premium">Premium</option><option value="Compact Plus">Compact Plus</option><option value="Compact">Compact</option></select></div><div class="form-group"><label>Amount</label><input type="number" id="tvAmount" placeholder="Enter amount"></div><button class="submit-btn" onclick="buyService(\'tv\')">Subscribe</button>'
                },
                electricity: {
                    title: 'Pay Electricity',
                    fields: '<div class="form-group"><label>Provider</label><select id="elecProvider"><option value="Ikeja Electric">Ikeja Electric</option><option value="Eko Electric">Eko Electric</option><option value="Ibadan Electric">Ibadan Electric</option></select></div><div class="form-group"><label>Meter Number</label><input type="text" id="elecMeter" placeholder="Enter meter number"></div><div class="form-group"><label>Amount</label><input type="number" id="elecAmount" placeholder="Enter amount"></div><button class="submit-btn" onclick="buyService(\'electricity\')">Pay Bill</button>'
                },
                education: {
                    title: 'Buy Education PIN',
                    fields: '<div class="form-group"><label>Exam Type</label><select id="eduExam"><option value="WAEC">WAEC</option><option value="NECO">NECO</option><option value="JAMB">JAMB</option></select></div><div class="form-group"><label>Quantity</label><input type="number" id="eduQuantity" placeholder="Number of pins" value="1"></div><div class="form-group"><label>Amount per PIN</label><input type="number" id="eduAmount" placeholder="Enter amount"></div><button class="submit-btn" onclick="buyService(\'education\')">Buy PIN</button>'
                },
                betting: {
                    title: 'Fund Betting Wallet',
                    fields: '<div class="form-group"><label>Provider</label><select id="betProvider"><option value="Bet9ja">Bet9ja</option><option value="SportyBet">SportyBet</option><option value="1xBet">1xBet</option></select></div><div class="form-group"><label>Username</label><input type="text" id="betUsername" placeholder="Enter username"></div><div class="form-group"><label>Amount</label><input type="number" id="betAmount" placeholder="Enter amount"></div><button class="submit-btn" onclick="buyService(\'betting\')">Fund Wallet</button>'
                }
            };
            
            var service = services[type];
            title.textContent = service.title;
            body.innerHTML = service.fields;
            modal.style.display = 'block';
        }

        function closeServiceModal() {
            document.getElementById('serviceModal').style.display = 'none';
        }

        async function buyService(type) {
            var endpoint, data;
            
            if (type === 'airtime') {
                endpoint = '/api/services/airtime/buy';
                data = {
                    phone: document.getElementById('airtimePhone').value,
                    network: document.getElementById('airtimeNetwork').value,
                    amount: parseFloat(document.getElementById('airtimeAmount').value)
                };
            } else if (type === 'tv') {
                endpoint = '/api/services/tv/subscribe';
                data = {
                    provider: document.getElementById('tvProvider').value,
                    smartCardNumber: document.getElementById('tvSmartCard').value,
                    package: document.getElementById('tvPackage').value,
                    amount: parseFloat(document.getElementById('tvAmount').value)
                };
            } else if (type === 'electricity') {
                endpoint = '/api/services/electricity/pay';
                data = {
                    provider: document.getElementById('elecProvider').value,
                    meterNumber: document.getElementById('elecMeter').value,
                    amount: parseFloat(document.getElementById('elecAmount').value)
                };
            } else if (type === 'education') {
                endpoint = '/api/services/education/buy-pin';
                data = {
                    exam: document.getElementById('eduExam').value,
                    quantity: parseInt(document.getElementById('eduQuantity').value),
                    amount: parseFloat(document.getElementById('eduAmount').value) * parseInt(document.getElementById('eduQuantity').value)
                };
            } else if (type === 'betting') {
                endpoint = '/api/services/betting/fund';
                data = {
                    provider: document.getElementById('betProvider').value,
                    username: document.getElementById('betUsername').value,
                    amount: parseFloat(document.getElementById('betAmount').value)
                };
            }
            
            if (!data.amount || data.amount <= 0) {
                showToast('Please enter a valid amount', 'error');
                return;
            }
            
            try {
                var response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                var result = await response.json();
                if (result.success) {
                    showToast(result.message, 'success');
                    closeServiceModal();
                    loadBalance();
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function loadData() {
            var status = document.getElementById('status');
            var container = document.getElementById('plansContainer');
            
            try {
                status.innerHTML = 'Loading plans...';
                
                var response = await fetch('/api/vtu/data-plans', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                var data = await response.json();
                
                if (!data.success) {
                    status.innerHTML = 'Error: ' + data.message;
                    return;
                }
                
                allPlans = [];
                var plans = data.data || {};
                var keys = Object.keys(plans);
                for (var i = 0; i < keys.length; i++) {
                    var network = keys[i];
                    for (var j = 0; j < plans[network].length; j++) {
                        var plan = plans[network][j];
                        plan.network = network;
                        allPlans.push(plan);
                    }
                }
                
                status.innerHTML = 'Loaded ' + allPlans.length + ' plans';
                renderPlans();
                loadBalance();
                
            } catch (error) {
                status.innerHTML = 'Error: ' + error.message;
            }
        }

        function renderPlans() {
            var container = document.getElementById('plansContainer');
            var filtered = allPlans;
            if (currentNetwork !== 'ALL') {
                filtered = [];
                for (var i = 0; i < allPlans.length; i++) {
                    if (allPlans[i].network === currentNetwork) {
                        filtered.push(allPlans[i]);
                    }
                }
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<p>No plans available</p>';
                return;
            }
            
            var html = '<div class="plans-grid">';
            for (var i = 0; i < filtered.length; i++) {
                var plan = filtered[i];
                var badgeClass = plan.provider.toLowerCase();
                var profitDisplay = plan.profit ? '<div class="plan-profit">💰 Profit: ₦' + plan.profit + '</div>' : '';
                html += '<div class="plan-card">';
                html += '<span class="provider-badge ' + badgeClass + '">' + plan.provider + '</span>';
                html += '<h3>' + plan.name + '</h3>';
                html += '<p>Network: ' + plan.network + ' | Validity: ' + plan.validity + '</p>';
                html += profitDisplay;
                html += '<div class="price">₦' + plan.price + '</div>';
                html += '<button class="buy-btn" onclick="buyPlan(\'' + plan.serviceID + '\')">Buy Now</button>';
                html += '</div>';
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function filterNetwork(network) {
            currentNetwork = network;
            var tabs = document.querySelectorAll('.network-tab');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
                if (tabs[i].textContent.trim() === network || (network === 'ALL' && tabs[i].textContent.trim() === 'All')) {
                    tabs[i].classList.add('active');
                }
            }
            renderPlans();
        }

        async function buyPlan(serviceID) {
            var phone = prompt('Enter phone number:');
            if (!phone) return;
            
            try {
                var response = await fetch('/api/vtu/buy-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ serviceID: serviceID, phoneNumber: phone })
                });
                var data = await response.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadBalance();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function loadBalance() {
            try {
                var response = await fetch('/api/wallet/balance', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var data = await response.json();
                if (data.success) {
                    document.getElementById('balanceDisplay').textContent = '₦' + data.balance;
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        window.onclick = function(event) {
            var serviceModal = document.getElementById('serviceModal');
            var fundModal = document.getElementById('fundModal');
            if (event.target === serviceModal) closeServiceModal();
            if (event.target === fundModal) closeFundModal();
        }

        loadData();
    </script>
</body>
</html>
