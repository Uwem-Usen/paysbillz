<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { background: #1a237e; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header-top .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .balance { font-size: 24px; font-weight: bold; color: #4caf50; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-fund { background: #4caf50; color: white; }
        .btn-paystack { background: #0a3d62; color: white; }
        .btn-logout { background: #c62828; color: white; }
        
        .services { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .service-card { background: white; padding: 20px; text-align: center; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .service-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .service-card .icon { font-size: 30px; }
        .service-card .label { font-weight: bold; margin-top: 5px; }
        .service-card .badge { font-size: 11px; background: #e8f5e9; color: #2e7d32; padding: 2px 10px; border-radius: 10px; display: inline-block; margin-top: 5px; }
        
        .network-tabs { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .network-tab { padding: 8px 20px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; background: white; font-weight: bold; }
        .network-tab.active { background: #1976d2; color: white; border-color: #1976d2; }
        
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .plan-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .plan-card .provider-badge { position: absolute; top: 10px; right: 10px; font-size: 10px; padding: 2px 10px; border-radius: 10px; font-weight: bold; }
        .plan-card .provider-badge.inlomax { background: #e3f2fd; color: #0d47a1; }
        .plan-card .provider-badge.strongmb { background: #f3e5f5; color: #4a148c; }
        .plan-card .price { font-size: 24px; font-weight: bold; color: #2e7d32; }
        .plan-card .buy-btn { background: #1976d2; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .plan-card .buy-btn:hover { background: #1565c0; }
        .plan-profit { font-size: 12px; color: #e65100; background: #fff3e0; padding: 2px 10px; border-radius: 10px; display: inline-block; margin: 5px 0; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 10px; max-width: 400px; }
        .modal-close { float: right; font-size: 28px; cursor: pointer; }
        .modal .form-group { margin-bottom: 15px; }
        .modal .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .modal .form-group input, .modal .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .modal .submit-btn { width: 100%; padding: 12px; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .modal .submit-btn:hover { background: #1565c0; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 5px; color: white; font-weight: bold; z-index: 9999; animation: slideIn 0.3s; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
        .toast.info { background: #1976d2; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div>
                    <h2>Dashboard</h2>
                    <p>Welcome <span id="userName">John Doe</span>!</p>
                </div>
                <div class="right">
                    <span class="balance" id="balanceDisplay">₦0.00</span>
                    <button class="btn btn-fund" onclick="openFundModal()">💰 Fund Wallet</button>
                    <button class="btn btn-paystack" onclick="payWithPaystack()">💳 Paystack</button>
                    <button class="btn btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <!-- Services -->
        <div class="services">
            <div class="service-card" onclick="openServiceModal('airtime')">
                <div class="icon">📱</div>
                <div class="label">Airtime</div>
                <div class="badge">Live</div>
            </div>
            <div class="service-card" onclick="openServiceModal('tv')">
                <div class="icon">📺</div>
                <div class="label">TV Subscription</div>
                <div class="badge">Live</div>
            </div>
            <div class="service-card" onclick="openServiceModal('electricity')">
                <div class="icon">💡</div>
                <div class="label">Electricity</div>
                <div class="badge">Live</div>
            </div>
            <div class="service-card" onclick="openServiceModal('education')">
                <div class="icon">🎓</div>
                <div class="label">Education</div>
                <div class="badge">New</div>
            </div>
            <div class="service-card" onclick="openServiceModal('betting')">
                <div class="icon">🎰</div>
                <div class="label">Betting</div>
                <div class="badge">Popular</div>
            </div>
        </div>

        <!-- Network Tabs -->
        <div class="network-tabs" id="networkTabs">
            <button class="network-tab active" data-network="ALL" onclick="filterNetwork('ALL')">🌐 All Networks</button>
            <button class="network-tab" data-network="MTN" onclick="filterNetwork('MTN')">MTN</button>
            <button class="network-tab" data-network="GLO" onclick="filterNetwork('GLO')">GLO</button>
            <button class="network-tab" data-network="AIRTEL" onclick="filterNetwork('AIRTEL')">AIRTEL</button>
            <button class="network-tab" data-network="9MOBILE" onclick="filterNetwork('9MOBILE')">9MOBILE</button>
        </div>

        <!-- Plans -->
        <div id="plansContainer">Loading plans...</div>
    </div>

    <!-- Fund Modal -->
    <div id="fundModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeFundModal()">&times;</span>
            <h2>💰 Fund Wallet</h2>
            <input type="number" id="fundAmount" placeholder="Enter amount" min="100">
            <button onclick="fundWallet()">Fund Wallet</button>
        </div>
    </div>

    <!-- Service Modal -->
    <div id="serviceModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeServiceModal()">&times;</span>
            <h2 id="serviceModalTitle">Service</h2>
            <div id="serviceModalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer"></div>

    <script>
        let allPlans = [];
        let currentNetwork = 'ALL';
        let isAdmin = false;
        let walletBalance = 0;

        // ============ USER ============
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        isAdmin = user.role === 'admin';
        document.getElementById('userName').textContent = user.name || 'John Doe';

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        // ============ TOAST ============
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // ============ WALLET ============
        function openFundModal() {
            document.getElementById('fundModal').style.display = 'block';
        }

        function closeFundModal() {
            document.getElementById('fundModal').style.display = 'none';
        }

        async function fundWallet() {
            const amount = document.getElementById('fundAmount').value;
            if (!amount || amount <= 0) {
                showToast('❌ Please enter a valid amount', 'error');
                return;
            }
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/wallet/fund', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ amount: parseFloat(amount) })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('✅ Wallet funded! New balance: ₦' + result.balance, 'success');
                    loadBalance();
                    closeFundModal();
                } else {
                    showToast('❌ Funding failed: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        async function loadBalance() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/wallet/balance', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const result = await response.json();
                if (result.success) {
                    walletBalance = result.balance;
                    document.getElementById('balanceDisplay').textContent = '₦' + (result.balance || 0);
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        // ============ PAYSTACK ============
        async function payWithPaystack() {
            const email = prompt('📧 Enter your email address:');
            if (!email) {
                showToast('❌ Email is required', 'error');
                return;
            }
            const amount = prompt('💰 Enter amount (₦100 minimum):');
            if (!amount) {
                showToast('❌ Amount is required', 'error');
                return;
            }
            if (amount < 100) {
                showToast('❌ Minimum amount is ₦100', 'error');
                return;
            }
            try {
                showToast('⏳ Initializing payment...', 'info');
                const token = localStorage.getItem('token');
                const response = await fetch('/api/paystack/initialize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ email, amount: parseFloat(amount) })
                });
                const result = await response.json();
                if (result.success) {
                    window.open(result.data.authorization_url, '_blank');
                    showToast('✅ Payment page opened!', 'success');
                } else {
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============ PLANS ============
        async function loadPlans() {
            const container = document.getElementById('plansContainer');
            container.innerHTML = 'Loading plans...';
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/vtu/data-plans', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const result = await response.json();
                if (!result.success) {
                    container.innerHTML = 'Error loading plans';
                    showToast('❌ Error loading plans', 'error');
                    return;
                }
                allPlans = [];
                const plans = result.data || {};
                Object.keys(plans).forEach(network => {
                    plans[network].forEach(plan => {
                        allPlans.push({ ...plan, network });
                    });
                });
                renderPlans();
                loadBalance();
            } catch (error) {
                container.innerHTML = 'Error: ' + error.message;
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        function renderPlans() {
            const container = document.getElementById('plansContainer');
            let filtered = allPlans;
            if (currentNetwork !== 'ALL') {
                filtered = allPlans.filter(p => p.network === currentNetwork);
            }
            if (filtered.length === 0) {
                container.innerHTML = '<p>No plans available for this network.</p>';
                return;
            }
            let html = '<div class="plans-grid">';
            filtered.forEach(plan => {
                const badgeClass = plan.provider.toLowerCase();
                const profitDisplay = isAdmin && plan.profit ? '<div class="plan-profit">💰 Profit: ₦' + plan.profit + '</div>' : '';
                html += '<div class="plan-card">';
                html += '<span class="provider-badge ' + badgeClass + '">' + plan.provider + '</span>';
                html += '<h3>' + plan.name + '</h3>';
                html += '<p>Network: ' + plan.network + '</p>';
                html += '<p>Validity: ' + plan.validity + '</p>';
                html += '<div class="price">₦' + plan.price + '</div>';
                html += profitDisplay;
                html += '<button class="buy-btn" onclick="buyPlan(\'' + plan.serviceID + '\', ' + plan.price + ')">Buy Now</button>';
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function filterNetwork(network) {
            currentNetwork = network;
            document.querySelectorAll('.network-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.network === network);
            });
            renderPlans();
        }

        async function buyPlan(serviceID, price) {
            const phone = prompt('📱 Enter phone number:');
            if (!phone) return;
            if (walletBalance < price) {
                showToast('❌ Insufficient balance! Need ₦' + price + ', have ₦' + walletBalance, 'error');
                return;
            }
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/vtu/buy-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ serviceID, phoneNumber: phone })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('✅ ' + result.message, 'success');
                    loadBalance();
                } else {
                    showToast('❌ Purchase failed: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============ SERVICE MODALS ============
        function openServiceModal(type) {
            const modal = document.getElementById('serviceModal');
            const title = document.getElementById('serviceModalTitle');
            const body = document.getElementById('serviceModalBody');
            
            const services = {
                airtime: {
                    title: '📱 Buy Airtime',
                    fields: 
                        <div class="form-group"><label>Phone Number</label><input type="text" id="airtimePhone" placeholder="08012345678"></div>
                        <div class="form-group"><label>Network</label><select id="airtimeNetwork"><option value="MTN">MTN</option><option value="GLO">GLO</option><option value="AIRTEL">AIRTEL</option><option value="9MOBILE">9MOBILE</option></select></div>
                        <div class="form-group"><label>Amount (₦)</label><input type="number" id="airtimeAmount" placeholder="Enter amount"></div>
                        <button class="submit-btn" onclick="buyService('airtime')">Buy Airtime</button>
                    
                },
                tv: {
                    title: '📺 TV Subscription',
                    fields: 
                        <div class="form-group"><label>Provider</label><select id="tvProvider"><option value="dstv">DStv</option><option value="gotv">GOtv</option><option value="startimes">StarTimes</option></select></div>
                        <div class="form-group"><label>Smart Card Number</label><input type="text" id="tvSmartCard" placeholder="Enter smart card number"></div>
                        <div class="form-group"><label>Package</label><select id="tvPackage"><option value="Premium">Premium</option><option value="Compact Plus">Compact Plus</option><option value="Compact">Compact</option></select></div>
                        <div class="form-group"><label>Amount (₦)</label><input type="number" id="tvAmount" placeholder="Enter amount"></div>
                        <button class="submit-btn" onclick="buyService('tv')">Subscribe</button>
                    
                },
                electricity: {
                    title: '💡 Pay Electricity',
                    fields: 
                        <div class="form-group"><label>Provider</label><select id="elecProvider"><option value="ikeja">Ikeja Electric</option><option value="eko">Eko Electric</option><option value="ibadan">Ibadan Electric</option></select></div>
                        <div class="form-group"><label>Meter Number</label><input type="text" id="elecMeter" placeholder="Enter meter number"></div>
                        <div class="form-group"><label>Amount (₦)</label><input type="number" id="elecAmount" placeholder="Enter amount"></div>
                        <button class="submit-btn" onclick="buyService('electricity')">Pay Bill</button>
                    
                },
                education: {
                    title: '🎓 Buy Education PIN',
                    fields: 
                        <div class="form-group"><label>Exam Type</label><select id="eduExam"><option value="waec">WAEC</option><option value="neco">NECO</option><option value="jamb">JAMB</option></select></div>
                        <div class="form-group"><label>Quantity</label><input type="number" id="eduQuantity" placeholder="Number of pins" value="1"></div>
                        <div class="form-group"><label>Amount (₦)</label><input type="number" id="eduAmount" placeholder="Enter amount"></div>
                        <button class="submit-btn" onclick="buyService('education')">Buy PIN</button>
                    
                },
                betting: {
                    title: '🎰 Fund Betting Wallet',
                    fields: 
                        <div class="form-group"><label>Provider</label><select id="betProvider"><option value="bet9ja">Bet9ja</option><option value="sportybet">SportyBet</option><option value="1xbet">1xBet</option></select></div>
                        <div class="form-group"><label>Username</label><input type="text" id="betUsername" placeholder="Enter username"></div>
                        <div class="form-group"><label>Amount (₦)</label><input type="number" id="betAmount" placeholder="Enter amount"></div>
                        <button class="submit-btn" onclick="buyService('betting')">Fund Wallet</button>
                    
                }
            };
            
            const service = services[type];
            title.textContent = service.title;
            body.innerHTML = service.fields;
            modal.style.display = 'block';
        }

        function closeServiceModal() {
            document.getElementById('serviceModal').style.display = 'none';
        }

        async function buyService(type) {
            let endpoint, data;
            
            switch(type) {
                case 'airtime':
                    endpoint = '/api/services/airtime/buy';
                    data = {
                        phone: document.getElementById('airtimePhone').value,
                        network: document.getElementById('airtimeNetwork').value,
                        amount: parseFloat(document.getElementById('airtimeAmount').value)
                    };
                    break;
                case 'tv':
                    endpoint = '/api/services/tv/subscribe';
                    data = {
                        provider: document.getElementById('tvProvider').value,
                        smartCardNumber: document.getElementById('tvSmartCard').value,
                        package: document.getElementById('tvPackage').value,
                        amount: parseFloat(document.getElementById('tvAmount').value)
                    };
                    break;
                case 'electricity':
                    endpoint = '/api/services/electricity/pay';
                    data = {
                        provider: document.getElementById('elecProvider').value,
                        meterNumber: document.getElementById('elecMeter').value,
                        amount: parseFloat(document.getElementById('elecAmount').value)
                    };
                    break;
                case 'education':
                    endpoint = '/api/services/education/buy-pin';
                    data = {
                        exam: document.getElementById('eduExam').value,
                        quantity: parseInt(document.getElementById('eduQuantity').value),
                        amount: parseFloat(document.getElementById('eduAmount').value)
                    };
                    break;
                case 'betting':
                    endpoint = '/api/services/betting/fund';
                    data = {
                        provider: document.getElementById('betProvider').value,
                        username: document.getElementById('betUsername').value,
                        amount: parseFloat(document.getElementById('betAmount').value)
                    };
                    break;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    showToast('✅ ' + result.message, 'success');
                    closeServiceModal();
                    loadBalance();
                } else {
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============ CLOSE MODALS ============
        window.onclick = function(event) {
            const fundModal = document.getElementById('fundModal');
            const serviceModal = document.getElementById('serviceModal');
            if (event.target === fundModal) closeFundModal();
            if (event.target === serviceModal) closeServiceModal();
        }

        // ============ INIT ============
        loadPlans();
    </script>
</body>
</html>
