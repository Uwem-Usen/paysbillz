<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Paysbillz Dashboard</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f2f5; }
        .header { background: #1a237e; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .balance { font-size: 24px; font-weight: bold; color: #4caf50; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-logout { background: #c62828; color: white; }
        .btn-paystack { background: #0a3d62; color: white; margin-left: 10px; }
        .btn-fund { background: #4caf50; color: white; margin-left: 10px; }
        .plan-card { background: white; padding: 15px; border-radius: 10px; margin: 10px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .plan-card .price { font-size: 20px; font-weight: bold; color: #2e7d32; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        .inlomax { background: #e3f2fd; color: #0d47a1; }
        .strongmb { background: #f3e5f5; color: #4a148c; }
        .services { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .service-card { background: white; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .service-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .service-card .icon { font-size: 30px; }
        .service-card .label { font-weight: bold; }
        .network-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        .network-tab { padding: 8px 20px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; background: white; font-weight: bold; }
        .network-tab.active { background: #1976d2; color: white; border-color: #1976d2; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 5px; color: white; font-weight: bold; z-index: 9999; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
        .toast.info { background: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                <div>
                    <h2>👋 <span id="userName">John Doe</span></h2>
                    <div id="userEmail">john@example.com</div>
                </div>
                <div>
                    <span class="balance" id="balanceDisplay">₦0.00</span>
                    <button class="btn btn-fund" onclick="openFundModal()">💰 Fund Wallet</button>
                    <button class="btn btn-paystack" onclick="payWithPaystack()">💳 Paystack</button>
                    <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
                </div>
            </div>
        </div>

        <!-- Services -->
        <div class="services">
            <div class="service-card" onclick="serviceAlert('Airtime')"><div class="icon">📱</div><div class="label">Airtime</div></div>
            <div class="service-card" onclick="serviceAlert('TV Subscription')"><div class="icon">📺</div><div class="label">TV</div></div>
            <div class="service-card" onclick="serviceAlert('Electricity')"><div class="icon">💡</div><div class="label">Electricity</div></div>
            <div class="service-card" onclick="serviceAlert('Education')"><div class="icon">🎓</div><div class="label">Education</div></div>
            <div class="service-card" onclick="serviceAlert('Betting')"><div class="icon">🎰</div><div class="label">Betting</div></div>
        </div>

        <!-- Networks -->
        <div class="network-tabs">
            <button class="network-tab active" onclick="filterNetwork('ALL')">🌐 All</button>
            <button class="network-tab" onclick="filterNetwork('MTN')">MTN</button>
            <button class="network-tab" onclick="filterNetwork('GLO')">GLO</button>
            <button class="network-tab" onclick="filterNetwork('AIRTEL')">AIRTEL</button>
            <button class="network-tab" onclick="filterNetwork('9MOBILE')">9MOBILE</button>
        </div>

        <div id="status">Loading plans...</div>
        <div id="plansContainer"></div>
    </div>

    <div id="toastContainer"></div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        let allPlans = [];
        let currentNetwork = 'ALL';

        if (!token) {
            window.location.href = '/login.html';
        }

        document.getElementById('userName').textContent = user.name || 'User';
        document.getElementById('userEmail').textContent = user.email || '';

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        function serviceAlert(name) {
            showToast('🚧 ' + name + ' service coming soon!', 'info');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        async function loadData() {
            const status = document.getElementById('status');
            const container = document.getElementById('plansContainer');
            
            try {
                status.innerHTML = '📡 Fetching plans...';
                
                const response = await fetch('/api/vtu/data-plans', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                console.log('Data:', data);
                
                if (!data.success) {
                    status.innerHTML = '❌ Error: ' + data.message;
                    return;
                }
                
                allPlans = [];
                const plans = data.data || {};
                Object.keys(plans).forEach(network => {
                    plans[network].forEach(plan => {
                        allPlans.push({ ...plan, network });
                    });
                });
                
                status.innerHTML = '✅ Loaded ' + allPlans.length + ' plans';
                renderPlans();
                loadBalance();
                
            } catch (error) {
                status.innerHTML = '❌ Error: ' + error.message;
                console.error(error);
            }
        }

        function renderPlans() {
            const container = document.getElementById('plansContainer');
            let filtered = allPlans;
            if (currentNetwork !== 'ALL') {
                filtered = allPlans.filter(p => p.network === currentNetwork);
            }
            
            if (!filtered.length) {
                container.innerHTML = '<p>No plans available</p>';
                return;
            }
            
            let html = '';
            filtered.forEach(plan => {
                const badgeClass = plan.provider.toLowerCase();
                html += '<div class="plan-card">';
                html += '<span class="badge ' + badgeClass + '">' + plan.provider + '</span>';
                html += '<h3>' + plan.name + '</h3>';
                html += '<p>Network: ' + plan.network + ' | Validity: ' + plan.validity + '</p>';
                if (plan.profit) {
                    html += '<p style="color:#e65100;font-size:12px;">💰 Profit: ₦' + plan.profit + '</p>';
                }
                html += '<div class="price">₦' + plan.price + '</div>';
                html += '<button onclick="buyPlan(\'' + plan.serviceID + '\')">Buy Now</button>';
                html += '</div>';
            });
            container.innerHTML = html;
        }

        function filterNetwork(network) {
            currentNetwork = network;
            document.querySelectorAll('.network-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.includes(network) || network === 'ALL');
            });
            renderPlans();
        }

        async function buyPlan(serviceID) {
            const phone = prompt('📱 Enter phone number:');
            if (!phone) return;
            
            try {
                const response = await fetch('/api/vtu/buy-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ serviceID, phoneNumber: phone })
                });
                const data = await response.json();
                if (data.success) {
                    showToast('✅ ' + data.message, 'success');
                    loadBalance();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        async function loadBalance() {
            try {
                const response = await fetch('/api/wallet/balance', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('balanceDisplay').textContent = '₦' + data.balance;
                }
            } catch (error) {
                console.error('Balance error:', error);
            }
        }

        function openFundModal() {
            const amount = prompt('💰 Enter amount to fund:');
            if (!amount) return;
            fundWallet(amount);
        }

        async function fundWallet(amount) {
            try {
                const response = await fetch('/api/wallet/fund', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ amount: parseFloat(amount) })
                });
                const data = await response.json();
                if (data.success) {
                    showToast('✅ Wallet funded! New balance: ₦' + data.balance, 'success');
                    loadBalance();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        async function payWithPaystack() {
            const email = prompt('📧 Enter your email:');
            if (!email) return;
            const amount = prompt('💰 Enter amount:');
            if (!amount) return;
            
            try {
                const response = await fetch('/api/paystack/initialize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ email, amount: parseFloat(amount) })
                });
                const data = await response.json();
                if (data.success) {
                    window.open(data.data.authorization_url, '_blank');
                    showToast('✅ Payment page opened!', 'success');
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        loadData();
    </script>
</body>
</html>
