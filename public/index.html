<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paysbillz - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#e3f2fd,#bbdefb);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login-box{background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:10px}
.logo h1{color:#1976d2;font-size:28px}
.logo .sub{color:#888;font-size:14px;margin-top:4px}
.demo{background:#e3f2fd;padding:10px;border-radius:8px;margin:12px 0;text-align:center;font-size:13px;color:#555;border:1px dashed #90caf9}
.demo strong{color:#1976d2}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;text-align:center}
.features span{background:#f5f5f5;padding:5px;border-radius:6px;font-size:11px;color:#555}
input{width:100%;padding:12px;margin:8px 0;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;transition:border-color .3s}
input:focus{border-color:#1976d2;outline:none}
.btn{width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold;transition:transform .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#1976d2,#0d47a1);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(25,118,210,.4)}
.error{color:#d32f2f;text-align:center;margin-top:10px;font-size:14px;padding:8px;background:#ffebee;border-radius:6px;display:none}
.error.show{display:block}
.success{color:#2e7d32;text-align:center;margin-top:10px;font-size:14px;padding:8px;background:#e8f5e9;border-radius:6px;display:none}
.success.show{display:block}
.tab-container{display:flex;margin:12px 0 15px;border-radius:8px;overflow:hidden;border:2px solid #1976d2}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-weight:bold;background:#fff;color:#1976d2;border:none;font-size:14px;transition:all .3s}
.tab.active{background:#1976d2;color:#fff}
.tab:hover{background:#1976d2;color:#fff}
.form-container{display:none}
.form-container.active{display:block}
.link{text-align:center;margin-top:12px;font-size:14px;color:#666}
.link a{color:#1976d2;text-decoration:none;font-weight:bold;cursor:pointer}
.link a:hover{text-decoration:underline}
.footer{text-align:center;margin-top:15px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <h1>💰 Paysbillz</h1>
        <div class="sub">Airtime &amp; Bills Payment Platform</div>
    </div>
    
    <div class="demo">📱 <strong>Demo:</strong> 08027449527 <span style="color:#999;">|</span> Any password</div>
    
    <div class="features">
        <span>📱 Airtime</span><span>📶 Data</span><span>📺 TV</span>
        <span>💡 Electricity</span><span>📚 Exam Pins</span><span>💰 Earn Profit</span>
    </div>

    <div class="tab-container">
        <button class="tab active" onclick="switchTab('login')" id="loginTab">Login</button>
        <button class="tab" onclick="switchTab('register')" id="registerTab">Register</button>
    </div>

    <!-- Login Form -->
    <div class="form-container active" id="loginForm">
        <input type="text" id="loginPhone" value="08027449527" placeholder="Phone Number">
        <input type="password" id="loginPassword" value="test123" placeholder="Password">
        <button class="btn btn-primary" onclick="login()">🔑 Login</button>
        <div id="loginError" class="error"></div>
        <div class="link">Don't have an account? <a onclick="switchTab('register')">Register here</a></div>
    </div>

    <!-- Register Form -->
    <div class="form-container" id="registerForm">
        <input type="text" id="registerPhone" placeholder="Phone Number (e.g., 08012345678)">
        <input type="text" id="registerName" placeholder="Full Name (optional)">
        <input type="password" id="registerPassword" placeholder="Password (min 6 chars)">
        <input type="password" id="registerConfirm" placeholder="Confirm Password">
        <button class="btn btn-primary" onclick="register()">📝 Create Account</button>
        <div id="registerError" class="error"></div>
        <div id="registerSuccess" class="success"></div>
        <div class="link">Already have an account? <a onclick="switchTab('login')">Login here</a></div>
    </div>
    
    <div class="footer">© 2026 Paysbillz • All rights reserved</div>
</div>

<script>
// ============================================
// USER AUTH - LOGIN & REGISTER
// ============================================
var API = 'https://paysbillz-api.onrender.com';

function switchTab(tab) {
    var loginTab = document.getElementById('loginTab');
    var registerTab = document.getElementById('registerTab');
    var loginForm = document.getElementById('loginForm');
    var registerForm = document.getElementById('registerForm');
    
    if (tab === 'login') {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
    } else {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
    }
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('registerError').classList.remove('show');
    document.getElementById('registerSuccess').classList.remove('show');
}

// ============================================
// LOGIN
// ============================================
function login() {
    var phone = document.getElementById('loginPhone').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errorDiv = document.getElementById('loginError');
    
    errorDiv.classList.remove('show');
    errorDiv.textContent = '';
    
    if (!phone || phone.length < 10) {
        errorDiv.textContent = '⚠️ Please enter a valid phone number';
        errorDiv.classList.add('show');
        return;
    }
    
    fetch(API + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) {
            localStorage.setItem('user', JSON.stringify(d.user));
            localStorage.setItem('userPhone', phone);
            localStorage.setItem('userBalance', d.user.balance || 0);
            localStorage.setItem('userName', d.user.name || 'Customer');
            
            errorDiv.style.color = '#2e7d32';
            errorDiv.style.background = '#e8f5e9';
            errorDiv.textContent = '✅ Login successful! Redirecting...';
            errorDiv.classList.add('show');
            
            setTimeout(function() {
                window.location.href = '/stable2.html';
            }, 800);
        } else {
            errorDiv.textContent = '❌ ' + (d.error || d.message || 'Login failed');
            errorDiv.classList.add('show');
        }
    })
    .catch(function(err) {
        errorDiv.textContent = '❌ Connection error: ' + err.message;
        errorDiv.classList.add('show');
    });
}

// ============================================
// REGISTER
// ============================================
function register() {
    var phone = document.getElementById('registerPhone').value.trim();
    var name = document.getElementById('registerName').value.trim();
    var password = document.getElementById('registerPassword').value;
    var confirm = document.getElementById('registerConfirm').value;
    var errorDiv = document.getElementById('registerError');
    var successDiv = document.getElementById('registerSuccess');
    
    errorDiv.classList.remove('show');
    successDiv.classList.remove('show');
    errorDiv.textContent = '';
    successDiv.textContent = '';
    
    if (!phone || phone.length < 10) {
        errorDiv.textContent = '⚠️ Please enter a valid phone number';
        errorDiv.classList.add('show');
        return;
    }
    if (!phone.match(/^0[789][01]\d{8}$/)) {
        errorDiv.textContent = '⚠️ Enter a valid Nigerian number (e.g., 08012345678)';
        errorDiv.classList.add('show');
        return;
    }
    if (!password || password.length < 6) {
        errorDiv.textContent = '⚠️ Password must be at least 6 characters';
        errorDiv.classList.add('show');
        return;
    }
    if (password !== confirm) {
        errorDiv.textContent = '⚠️ Passwords do not match';
        errorDiv.classList.add('show');
        return;
    }
    
    fetch(API + '/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, name: name || 'Customer', password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success) {
            successDiv.textContent = '✅ Registration successful! You can now login.';
            successDiv.classList.add('show');
            
            document.getElementById('loginPhone').value = phone;
            document.getElementById('loginPassword').value = password;
            
            setTimeout(function() {
                switchTab('login');
                successDiv.classList.remove('show');
            }, 2000);
        } else {
            errorDiv.textContent = '❌ ' + (d.error || d.message || 'Registration failed');
            errorDiv.classList.add('show');
        }
    })
    .catch(function(err) {
        errorDiv.textContent = '❌ Connection error: ' + err.message;
        errorDiv.classList.add('show');
    });
}

// ============================================
// ENTER KEY SUPPORT
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loginPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });
    document.getElementById('loginPhone').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });
    document.getElementById('registerConfirm').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') register();
    });
    document.getElementById('registerPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') register();
    });
});
</script>
</body>
</html>
