<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paysbillz Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f0f2f5; 
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%;
            min-height: 100vh;
        }
        
        .header { 
            background: linear-gradient(135deg, #1976d2, #0d47a1); 
            color: white; 
            padding: 16px 20px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            position: relative;
            z-index: 1;
        }
        .header h1 { font-size: 22px; margin-bottom: 4px; }
        .header .phone { font-size: 13px; opacity: 0.9; word-break: break-all; }
        .header .phone .loading-text { opacity: 0.7; }
        
        .balance-card { 
            background: white; 
            padding: 16px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            display: flex; 
            justify-content: space-around; 
            flex-wrap: wrap;
            min-height: 80px;
        }
        .balance-item { 
            text-align: center; 
            padding: 6px 8px; 
            flex: 1; 
            min-width: 80px; 
        }
        .balance-item .label { font-size: 11px; color: #888; }
        .balance-item .amount { font-size: 20px; font-weight: bold; transition: none; }
        .balance-item .amount.primary { color: #1976d2; }
        .balance-item .amount.profit { color: #2e7d32; }
        
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 16px; 
        }
        .menu-item { 
            background: white; 
            padding: 12px 4px; 
            border-radius: 10px; 
            text-align: center; 
            cursor: pointer; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
            border: none; 
            font-size: 12px; 
            width: 100%;
            transition: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .menu-item:active { 
            transform: scale(0.95); 
        }
        .menu-item .icon { font-size: 24px; display: block; margin-bottom: 2px; }
        .menu-item .name { font-size: 10px; font-weight: bold; }
        .menu-item.fund { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; }
        .menu-item.danger { background: linear-gradient(135deg, #d32f2f, #b71c1c); color: white; }
        .menu-item.withdraw { background: linear-gradient(135deg, #f57c00, #e65100); color: white; }
        
        .card { 
            background: white; 
            padding: 16px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            min-height: 100px;
        }
        .card h3 { 
            margin-bottom: 12px; 
            color: #333; 
            font-size: 15px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 8px; 
        }
        
        .transaction-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            border-bottom: 1px solid #f5f5f5; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-item .left { display: flex; flex-direction: column; }
        .transaction-item .type { font-weight: bold; font-size: 13px; }
        .transaction-item .date { font-size: 10px; color: #888; }
        .transaction-item .amount { font-weight: bold; font-size: 14px; }
        .transaction-item .status { 
            padding: 2px 10px; 
            border-radius: 10px; 
            font-size: 10px; 
            font-weight: bold; 
            display: inline-block;
        }
        .status.success { background: #e8f5e9; color: #2e7d32; }
        .status.failed { background: #ffebee; color: #c62828; }
        .status.pending { background: #fff3e0; color: #e65100; }
        .profit-badge { 
            background: #e8f5e9; 
            color: #2e7d32; 
            padding: 1px 8px; 
            border-radius: 8px; 
            font-size: 10px; 
            display: inline-block;
        }
        
        .btn { 
            padding: 10px 16px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            width: 100%;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #1976d2; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-withdraw { background: #f57c00; color: white; }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            padding: 16px;
            overflow-y: auto;
        }
        .modal.show { display: flex; }
        .modal-content { 
            background: white; 
            padding: 24px; 
            border-radius: 12px; 
            max-width: 450px; 
            width: 100%; 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative;
            margin: auto;
            animation: modalFadeIn 0.2s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h2 { margin-bottom: 15px; color: #1976d2; font-size: 20px; }
        .modal-content input, .modal-content select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 14px; 
            -webkit-appearance: none;
            appearance: none;
        }
        .modal-content .close { 
            float: right; 
            cursor: pointer; 
            font-size: 28px; 
            color: #888; 
            line-height: 1;
            padding: 0 8px;
        }
        .modal-content .close:active { color: #333; }
        .result-msg { 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 14px; 
        }
        .result-msg.success { background: #e8f5e9; color: #2e7d32; }
        .result-msg.error { background: #ffebee; color: #c62828; }
        .result-msg.loading { background: #fff3e0; color: #e65100; }
        
        .no-transactions {
            color: #888;
            text-align: center;
            font-size: 14px;
            padding: 20px 0;
        }
        
        @media (max-width: 600px) {
            body { padding: 8px; }
            .header h1 { font-size: 18px; }
            .balance-item .amount { font-size: 17px; }
            .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .menu-item { padding: 10px 4px; }
            .menu-item .icon { font-size: 20px; }
            .menu-item .name { font-size: 9px; }
            .modal-content { padding: 18px; margin: 10px; }
            .balance-card { padding: 12px; }
        }
        
        @media (max-width: 400px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💰 Paysbillz</h1>
            <div class="phone" id="phoneDisplay">Phone: <span class="loading-text">Loading...</span></div>
        </div>

        <!-- Balance -->
        <div class="balance-card">
            <div class="balance-item">
                <div class="label">Wallet Balance</div>
                <div class="amount primary" id="balanceDisplay">₦0.00</div>
            </div>
            <div class="balance-item">
                <div class="label">Profit Balance</div>
                <div class="amount profit" id="profitDisplay">₦0.00</div>
            </div>
            <div class="balance-item">
                <div class="label">Transactions</div>
                <div class="amount" id="transactionCount" style="font-size:18px;color:#555;">0</div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="menu-grid">
            <button class="menu-item" onclick="openModal('data')">
                <span class="icon">📱</span>
                <span class="name">Data</span>
            </button>
            <button class="menu-item" onclick="openModal('airtime')">
                <span class="icon">📞</span>
                <span class="name">Airtime</span>
            </button>
            <button class="menu-item" onclick="openModal('tv')">
                <span class="icon">📺</span>
                <span class="name">TV</span>
            </button>
            <button class="menu-item" onclick="openModal('electricity')">
                <span class="icon">💡</span>
                <span class="name">Electricity</span>
            </button>
            <button class="menu-item" onclick="openModal('education')">
                <span class="icon">📚</span>
                <span class="name">Exam Pins</span>
            </button>
            <button class="menu-item fund" onclick="openModal('fund')">
                <span class="icon">💳</span>
                <span class="name">Fund</span>
            </button>
            <button class="menu-item withdraw" onclick="openModal('withdraw')">
                <span class="icon">💸</span>
                <span class="name">Withdraw</span>
            </button>
            <button class="menu-item danger" onclick="logout()">
                <span class="icon">🚪</span>
                <span class="name">Logout</span>
            </button>
        </div>

        <!-- Recent Transactions -->
        <div class="card">
            <h3>📋 Recent Transactions</h3>
            <div id="transactions">
                <p class="no-transactions">Loading transactions...</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Buy Service</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_URL = 'https://paysbillz-api.onrender.com';
        let userPhone = localStorage.getItem('userPhone') || '08027449527';
        let isLoading = false;

        // ============================================
        // INIT - Load immediately
        // ============================================
        // Show phone from localStorage immediately
        if (localStorage.getItem('userPhone')) {
            document.getElementById('phoneDisplay').innerHTML = 'Phone: <strong>' + localStorage.getItem('userPhone') + '</strong>';
        }

        // ============================================
        // Load User Data
        // ============================================
        async function loadDashboard() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                const response = await fetch(`${API_URL}/api/profile?phone=${userPhone}`);
                const data = await response.json();
                
                if (data.success) {
                    const user = data.user;
                    
                    // Update phone
                    document.getElementById('phoneDisplay').innerHTML = 'Phone: <strong>' + user.phone + '</strong>';
                    
                    // Update balances
                    document.getElementById('balanceDisplay').textContent = '₦' + Number(user.balance || 0).toLocaleString();
                    document.getElementById('profitDisplay').textContent = '₦' + Number(user.profitBalance || 0).toLocaleString();
                    document.getElementById('transactionCount').textContent = user.transactions ? user.transactions.length : 0;
                    
                    // Update transactions
                    renderTransactions(user.transactions);
                }
            } catch (error) {
                console.error('❌ Error loading dashboard:', error);
            }
            
            isLoading = false;
        }

        // ============================================
        // Render Transactions
        // ============================================
        function renderTransactions(transactions) {
            const container = document.getElementById('transactions');
            
            if (!transactions || transactions.length === 0) {
                container.innerHTML = '<p class="no-transactions">No transactions yet.</p>';
                return;
            }
            
            let html = '';
            const latest = transactions.slice().reverse().slice(0, 10);
            
            latest.forEach(t => {
                const statusClass = t.status || 'pending';
                const amount = Number(t.amount || 0);
                const profit = Number(t.profit || 0);
                const date = t.created_at ? new Date(t.created_at).toLocaleDateString() : 'N/A';
                const type = t.type || 'Transaction';
                
                html += `
                    <div class="transaction-item">
                        <div class="left">
                            <span class="type">${type}</span>
                            <span class="date">${date}</span>
                            ${t.plan ? `<span style="font-size:10px;color:#888;">${t.plan}</span>` : ''}
                            ${t.bankName ? `<span style="font-size:10px;color:#888;">${t.bankName}</span>` : ''}
                        </div>
                        <div style="text-align:right;">
                            <div class="amount">₦${amount.toFixed(2)}</div>
                            ${profit > 0 ? `<span class="profit-badge">+₦${profit.toFixed(2)}</span>` : ''}
                            <span class="status ${statusClass}">${statusClass.toUpperCase()}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ============================================
        // Modal Functions
        // ============================================
        function openModal(type) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            
            switch(type) {
                case 'data':
                    title.textContent = '📱 Buy Data';
                    body.innerHTML = `
                        <form onsubmit="buyData(event)">
                            <input type="text" id="dataPhone" value="${userPhone}" placeholder="Phone Number">
                            <select id="dataPlan">
                                <option value="MTN_SME_500MB">MTN SME 500MB - ₦500</option>
                                <option value="MTN_SME_1GB">MTN SME 1GB - ₦800</option>
                                <option value="MTN_SME_2GB">MTN SME 2GB - ₦1,200</option>
                                <option value="MTN_SME_3GB">MTN SME 3GB - ₦1,500</option>
                                <option value="MTN_SME_5GB">MTN SME 5GB - ₦2,000</option>
                                <option value="AIRTEL_500MB">AIRTEL 500MB - ₦450</option>
                                <option value="AIRTEL_1GB">AIRTEL 1GB - ₦750</option>
                                <option value="GLO_500MB">GLO 500MB - ₦400</option>
                                <option value="GLO_1GB">GLO 1GB - ₦700</option>
                            </select>
                            <button type="submit" class="btn btn-primary">Buy Data</button>
                        </form>
                        <div id="dataResult"></div>
                    `;
                    break;
                    
                case 'airtime':
                    title.textContent = '📞 Buy Airtime';
                    body.innerHTML = `
                        <form onsubmit="buyAirtime(event)">
                            <input type="text" id="airtimePhone" value="${userPhone}" placeholder="Phone Number">
                            <input type="number" id="airtimeAmount" placeholder="Amount (min ₦50)" min="50">
                            <button type="submit" class="btn btn-primary">Buy Airtime</button>
                        </form>
                        <div id="airtimeResult"></div>
                    `;
                    break;
                    
                case 'tv':
                    title.textContent = '📺 TV Subscription';
                    body.innerHTML = `
                        <form onsubmit="buyTV(event)">
                            <input type="text" id="tvIuc" placeholder="Smart Card Number (e.g., 7027914329)">
                            <select id="tvService">
                                <option value="90">DSTV Padi - ₦4,400</option>
                                <option value="91">DSTV Yanga - ₦6,000</option>
                                <option value="92">DSTV Confam - ₦11,000</option>
                                <option value="93">DSTV Compact - ₦19,000</option>
                                <option value="105">DSTV Compact Plus - ₦30,000</option>
                                <option value="94">GOTV Smallie - ₦1,900</option>
                                <option value="96">GOTV Jolli - ₦5,800</option>
                                <option value="97">GOTV Jinja - ₦3,900</option>
                                <option value="95">GOTV Max - ₦8,500</option>
                            </select>
                            <button type="submit" class="btn btn-primary">Subscribe</button>
                        </form>
                        <div id="tvResult"></div>
                    `;
                    break;
                    
                case 'electricity':
                    title.textContent = '💡 Pay Electricity';
                    body.innerHTML = `
                        <form onsubmit="buyElectricity(event)">
                            <select id="elecService">
                                <option value="1">IKEDC</option>
                                <option value="2">EKEDC</option>
                                <option value="3">KEDCO</option>
                                <option value="4">PHED</option>
                                <option value="5">JED</option>
                                <option value="6">IBEDC</option>
                                <option value="8">AEDC</option>
                                <option value="9">EEDC</option>
                            </select>
                            <input type="text" id="elecMeter" placeholder="Meter Number">
                            <select id="elecType">
                                <option value="1">Prepaid</option>
                                <option value="2">Postpaid</option>
                            </select>
                            <input type="number" id="elecAmount" placeholder="Amount">
                            <button type="submit" class="btn btn-primary">Pay</button>
                        </form>
                        <div id="elecResult"></div>
                    `;
                    break;
                    
                case 'education':
                    title.textContent = '📚 Buy Exam Pins';
                    body.innerHTML = `
                        <form onsubmit="buyEducation(event)">
                            <select id="eduService">
                                <option value="1">WAEC - ₦5,250</option>
                                <option value="2">NECO - ₦2,250</option>
                                <option value="3">NABTEB - ₦900</option>
                            </select>
                            <input type="number" id="eduQuantity" value="1" min="1" placeholder="Quantity">
                            <button type="submit" class="btn btn-primary">Buy Pin</button>
                        </form>
                        <div id="eduResult"></div>
                    `;
                    break;
                    
                case 'fund':
                    title.textContent = '💳 Fund Wallet';
                    body.innerHTML = `
                        <form onsubmit="fundWallet(event)">
                            <div style="background:#e3f2fd;padding:12px;border-radius:8px;margin-bottom:12px;">
                                <p style="font-size:13px;color:#555;margin:0;">💡 Enter amount to credit your wallet instantly.</p>
                            </div>
                            <input type="number" id="fundAmount" placeholder="Amount (min ₦100)" min="100" required>
                            <button type="submit" class="btn btn-success">💳 Add Funds</button>
                        </form>
                        <div id="fundResult"></div>
                    `;
                    break;

                case 'withdraw':
                    title.textContent = '💸 Withdraw Profit';
                    body.innerHTML = `
                        <form onsubmit="withdrawProfit(event)">
                            <div style="background:#fff3e0;padding:12px;border-radius:8px;margin-bottom:12px;">
                                <p style="font-size:13px;color:#555;margin:0;">
                                    💰 Available: <strong id="withdrawBalance">₦${document.getElementById('profitDisplay').textContent.replace(/[^0-9.]/g, '') || '0'}</strong>
                                </p>
                            </div>
                            <input type="number" id="withdrawAmount" placeholder="Amount (min ₦100)" min="100" required>
                            <input type="text" id="withdrawBank" placeholder="Bank Name (e.g., GTBank)" required>
                            <input type="text" id="withdrawAccount" placeholder="Account Number" required>
                            <input type="text" id="withdrawName" placeholder="Account Name" required>
                            <button type="submit" class="btn btn-withdraw">💸 Request Withdrawal</button>
                        </form>
                        <div id="withdrawResult"></div>
                    `;
                    break;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        // Click outside to close
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================
        // Buy Functions
        // ============================================
        async function buyData(e) {
            e.preventDefault();
            const phone = document.getElementById('dataPhone').value;
            const plan = document.getElementById('dataPlan').value;
            const resultDiv = document.getElementById('dataResult');
            
            resultDiv.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/buy-data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, plan })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result-msg success">✅ Success! Profit: ₦${data.result.profit || 0}</div>`;
                    setTimeout(() => { closeModal(); loadDashboard(); }, 2000);
                } else {
                    resultDiv.innerHTML = `<div class="result-msg error">❌ ${data.error || 'Purchase failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-msg error">❌ Connection error: ${error.message}</div>`;
            }
        }

        async function buyAirtime(e) {
            e.preventDefault();
            const phone = document.getElementById('airtimePhone').value;
            const amount = document.getElementById('airtimeAmount').value;
            const resultDiv = document.getElementById('airtimeResult');
            
            if (!amount || amount < 50) {
                resultDiv.innerHTML = '<div class="result-msg error">❌ Amount must be at least ₦50</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/buy-airtime`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, amount: Number(amount) })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result-msg success">✅ Success! Profit: ₦${data.result.profit || 0}</div>`;
                    setTimeout(() => { closeModal(); loadDashboard(); }, 2000);
                } else {
                    resultDiv.innerHTML = `<div class="result-msg error">❌ ${data.error || 'Purchase failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-msg error">❌ Connection error: ${error.message}</div>`;
            }
        }

        async function buyTV(e) {
            e.preventDefault();
            const serviceID = document.getElementById('tvService').value;
            const iucNum = document.getElementById('tvIuc').value;
            const resultDiv = document.getElementById('tvResult');
            
            if (!iucNum) {
                resultDiv.innerHTML = '<div class="result-msg error">❌ Smart Card Number is required</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/buy-tv`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceID, iucNum })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = '<div class="result-msg success">✅ TV Subscription successful!</div>';
                    setTimeout(() => { closeModal(); loadDashboard(); }, 2000);
                } else {
                    resultDiv.innerHTML = `<div class="result-msg error">❌ ${data.error || 'Subscription failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-msg error">❌ Connection error: ${error.message}</div>`;
            }
        }

        async function buyElectricity(e) {
            e.preventDefault();
            const serviceID = document.getElementById('elecService').value;
            const meterNum = document.getElementById('elecMeter').value;
            const meterType = document.getElementById('elecType').value;
            const amount = document.getElementById('elecAmount').value;
            const resultDiv = document.getElementById('elecResult');
            
            if (!meterNum || !amount) {
                resultDiv.innerHTML = '<div class="result-msg error">❌ Meter Number and Amount are required</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/buy-electricity`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceID, meterNum, meterType: Number(meterType), amount: Number(amount) })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = '<div class="result-msg success">✅ Electricity payment successful!</div>';
                    setTimeout(() => { closeModal(); loadDashboard(); }, 2000);
                } else {
                    resultDiv.innerHTML = `<div class="result-msg error">❌ ${data.error || 'Payment failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-msg error">❌ Connection error: ${error.message}</div>`;
            }
        }

        // ============================================
        // Fund Wallet
        // ============================================
        async function fundWallet(e) {
            e.preventDefault();
            const amount = document.getElementById('fundAmount').value;
            const resultDiv = document.getElementById('fundResult');
            
            if (!amount || amount < 100) {
                resultDiv.innerHTML = '<div class="result-msg error">❌ Amount must be at least ₦100</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/fund-wallet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: userPhone, 
                        amount: Number(amount) 
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result-msg success">✅ ₦${Number(amount).toLocaleString()} added!</div>`;
                    setTimeout(() => { closeModal(); loadDashboard(); }, 1500);
                } else {
                    resultDiv.innerHTML = `<div class="result-msg error">❌ ${data.error || 'Funding failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-msg error">❌ Connection error: ${error.message}</div>`;
            }
        }

        // ============================================
        // WITHDRAW PROFIT
        // ============================================
        async function withdrawProfit(e) {
            e.preventDefault();
            const amount = document.getElementById('withdrawAmount').value;
            const bank = document.getElementById('withdrawBank').value;
            const account = document.getElementById('withdrawAccount').value;
            const name = document.getElementById('withdrawName').value;
            const resultDiv = document.getElementById('withdrawResult');
            
            if (!amount || amount < 100) {
                resultDiv.innerHTML = '<div class="result-msg error">❌ Amount must be at least ₦100</div>';
                return;
            }
            
            if (!bank || !account || !name) {
                resultDiv.innerHTML = '<div class="result-msg error">❌ Please fill all bank details</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result-msg loading">⏳ Processing withdrawal request...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/withdraw-profit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: userPhone, 
                        amount: Number(amount),
                        bankName: bank,
                        accountNumber: account,
                        accountName: name
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `<div class="result-msg success">✅ Withdrawal request submitted!</div>`;
                    setTimeout(() => { closeModal(); loadDashboard(); }, 2000);
                } else {
                    resultDiv.innerHTML = `<div class="result-msg error">❌ ${data.error || 'Withdrawal failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-msg error">❌ Connection error: ${error.message}</div>`;
            }
        }

        // ============================================
        // Logout
        // ============================================
        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        // ============================================
        // Check login
        // ============================================
        if (!localStorage.getItem('user')) {
            window.location.href = '/';
        }

        // ============================================
        // Load Dashboard - Only once on page load
        // ============================================
        loadDashboard();
    </script>
