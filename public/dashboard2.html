<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paysbillz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f2f5;padding:12px}
.container{max-width:900px;margin:0 auto}
.header{background:linear-gradient(135deg,#1976d2,#0d47a1);color:#fff;padding:16px 20px;border-radius:12px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .phone{font-size:13px;opacity:.9}
.balance-card{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-around;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.balance-item{text-align:center;padding:6px 8px;flex:1;min-width:80px}
.balance-item .label{font-size:11px;color:#888}
.balance-item .amount{font-size:20px;font-weight:bold}
.balance-item .amount.primary{color:#1976d2}
.balance-item .amount.profit{color:#2e7d32}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.menu-item{background:#fff;padding:12px 4px;border-radius:10px;text-align:center;cursor:pointer;border:none;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.menu-item:active{opacity:.7}
.menu-item .icon{font-size:24px;display:block;margin-bottom:2px}
.menu-item .name{font-size:10px;font-weight:bold}
.menu-item.fund{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff}
.menu-item.danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff}
.menu-item.withdraw{background:linear-gradient(135deg,#f57c00,#e65100);color:#fff}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card h3{margin-bottom:12px;color:#333;font-size:15px;border-bottom:1px solid #eee;padding-bottom:8px}
.transaction-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;align-items:center;flex-wrap:wrap}
.transaction-item:last-child{border-bottom:none}
.transaction-item .type{font-weight:bold;font-size:13px}
.transaction-item .date{font-size:10px;color:#888}
.transaction-item .amount{font-weight:bold;font-size:14px}
.status{padding:2px 10px;border-radius:10px;font-size:10px;font-weight:bold}
.status.success{background:#e8f5e9;color:#2e7d32}
.status.failed{background:#ffebee;color:#c62828}
.status.pending{background:#fff3e0;color:#e65100}
.profit-badge{background:#e8f5e9;color:#2e7d32;padding:1px 8px;border-radius:8px;font-size:10px}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;width:100%}
.btn:active{opacity:.8}
.btn-primary{background:#1976d2;color:#fff}
.btn-success{background:#2e7d32;color:#fff}
.btn-withdraw{background:#f57c00;color:#fff}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:16px}
.modal.show{display:flex}
.modal-content{background:#fff;padding:24px;border-radius:12px;max-width:450px;width:100%;max-height:90vh;overflow-y:auto}
.modal-content h2{margin-bottom:15px;color:#1976d2;font-size:20px}
.modal-content input,.modal-content select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
.modal-content .close{float:right;cursor:pointer;font-size:28px;color:#888;padding:0 8px;background:none;border:none}
.modal-content .close:hover{color:#333}
.result-msg{margin-top:10px;padding:10px;border-radius:8px;text-align:center;font-size:14px}
.result-msg.success{background:#e8f5e9;color:#2e7d32}
.result-msg.error{background:#ffebee;color:#c62828}
.result-msg.loading{background:#fff3e0;color:#e65100}
.no-transactions{color:#888;text-align:center;font-size:14px;padding:20px 0}
@media(max-width:600px){body{padding:8px}.menu-grid{grid-template-columns:repeat(3,1fr)}.menu-item .icon{font-size:20px}}
@media(max-width:400px){.menu-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>💰 Paysbillz</h1><div class="phone" id="phoneDisplay">Loading...</div></div>
<div class="balance-card">
<div class="balance-item"><div class="label">Wallet</div><div class="amount primary" id="balanceDisplay">₦0.00</div></div>
<div class="balance-item"><div class="label">Profit</div><div class="amount profit" id="profitDisplay">₦0.00</div></div>
<div class="balance-item"><div class="label">Txns</div><div class="amount" id="transactionCount" style="font-size:18px;color:#555;">0</div></div>
</div>
<div class="menu-grid">
<button class="menu-item" onclick="openModal('data')"><span class="icon">📱</span><span class="name">Data</span></button>
<button class="menu-item" onclick="openModal('airtime')"><span class="icon">📞</span><span class="name">Airtime</span></button>
<button class="menu-item" onclick="openModal('tv')"><span class="icon">📺</span><span class="name">TV</span></button>
<button class="menu-item" onclick="openModal('electricity')"><span class="icon">💡</span><span class="name">Electricity</span></button>
<button class="menu-item" onclick="openModal('education')"><span class="icon">📚</span><span class="name">Exam Pins</span></button>
<button class="menu-item fund" onclick="openModal('fund')"><span class="icon">💳</span><span class="name">Fund</span></button>
<button class="menu-item withdraw" onclick="openModal('withdraw')"><span class="icon">💸</span><span class="name">Withdraw</span></button>
<button class="menu-item danger" id="logoutBtn"><span class="icon">🚪</span><span class="name">Logout</span></button>
</div>
<div class="card"><h3>📋 Recent</h3><div id="transactions"><p class="no-transactions">Loading...</p></div></div>
</div>
<div class="modal" id="modal"><div class="modal-content"><button class="close" onclick="closeModal()">&times;</button><h2 id="modalTitle">Service</h2><div id="modalBody"></div></div></div>
<script>
// ============================================
// STABLE - NO REDIRECT LOOP
// ============================================
(function() {
    var API = 'https://paysbillz-api.onrender.com';
    var phone = localStorage.getItem('userPhone') || '08027449527';
    var loaded = false;

    // Check if user is logged in
    if (!localStorage.getItem('user')) {
        window.location.href = '/';
        return;
    }

    document.getElementById('phoneDisplay').textContent = 'Phone: ' + phone;

    function loadData() {
        if (loaded) return;
        loaded = true;

        fetch(API + '/api/profile?phone=' + phone)
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.success) {
                    var u = d.user;
                    document.getElementById('phoneDisplay').textContent = 'Phone: ' + u.phone;
                    document.getElementById('balanceDisplay').textContent = '₦' + (u.balance || 0).toLocaleString();
                    document.getElementById('profitDisplay').textContent = '₦' + (u.profitBalance || 0).toLocaleString();
                    document.getElementById('transactionCount').textContent = u.transactions ? u.transactions.length : 0;

                    var c = document.getElementById('transactions');
                    var t = u.transactions || [];
                    if (t.length === 0) {
                        c.innerHTML = '<p class="no-transactions">No transactions yet.</p>';
                        return;
                    }
                    var h = '';
                    var start = Math.max(0, t.length - 10);
                    for (var i = t.length - 1; i >= start; i--) {
                        var x = t[i];
                        var s = x.status || 'pending';
                        var amt = Number(x.amount || 0);
                        var p = Number(x.profit || 0);
                        var d = x.created_at ? new Date(x.created_at).toLocaleDateString() : 'N/A';
                        h += '<div class="transaction-item"><div class="left"><span class="type">' + (x.type || 'Txn') + '</span><span class="date">' + d + '</span></div><div style="text-align:right;"><div class="amount">₦' + amt.toFixed(2) + '</div>' + (p > 0 ? '<span class="profit-badge">+₦' + p.toFixed(2) + '</span>' : '') + '<span class="status ' + s + '">' + s.toUpperCase() + '</span></div></div>';
                    }
                    c.innerHTML = h;
                }
            })
            .catch(function() {
                document.getElementById('transactions').innerHTML = '<p class="no-transactions">Error loading. Refresh page.</p>';
            });
    }

    function openModal(type) {
        var m = document.getElementById('modal');
        var t = document.getElementById('modalTitle');
        var b = document.getElementById('modalBody');
        m.style.display = 'flex';
        document.body.style.overflow = 'hidden';

        var forms = {
            data: '<form onsubmit="buyData(event)"><input type="text" id="dataPhone" value="' + phone + '" placeholder="Phone Number"><select id="dataPlan"><optgroup label="MTN SME"><option value="MTN_SME_500MB">MTN SME 500MB - ₦500</option><option value="MTN_SME_1GB">MTN SME 1GB - ₦800</option><option value="MTN_SME_2GB">MTN SME 2GB - ₦1,200</option><option value="MTN_SME_3GB">MTN SME 3GB - ₦1,500</option><option value="MTN_SME_5GB">MTN SME 5GB - ₦2,000</option></optgroup><optgroup label="MTN AWOOF"><option value="MTN_AWOOF_500MB">MTN AWOOF 500MB - ₦220</option><option value="MTN_AWOOF_1GB">MTN AWOOF 1GB - ₦260</option><option value="MTN_AWOOF_2.5GB">MTN AWOOF 2.5GB - ₦590</option><option value="MTN_AWOOF_5GB">MTN AWOOF 5GB - ₦1,150</option><option value="MTN_AWOOF_10GB">MTN AWOOF 10GB - ₦3,500</option></optgroup><optgroup label="MTN SHARE"><option value="MTN_SHARE_500MB">MTN SHARE 500MB - ₦330</option><option value="MTN_SHARE_1GB">MTN SHARE 1GB - ₦435</option><option value="MTN_SHARE_2GB">MTN SHARE 2GB - ₦970</option><option value="MTN_SHARE_3GB">MTN SHARE 3GB - ₦1,380</option><option value="MTN_SHARE_5GB">MTN SHARE 5GB - ₦1,700</option></optgroup><optgroup label="AIRTEL"><option value="AIRTEL_500MB">AIRTEL 500MB - ₦450</option><option value="AIRTEL_1GB">AIRTEL 1GB - ₦750</option><option value="AIRTEL_2GB">AIRTEL 2GB - ₦1,200</option><option value="AIRTEL_3GB">AIRTEL 3GB - ₦1,500</option><option value="AIRTEL_5GB">AIRTEL 5GB - ₦2,000</option></optgroup><optgroup label="GLO"><option value="GLO_500MB">GLO 500MB - ₦400</option><option value="GLO_1GB">GLO 1GB - ₦700</option><option value="GLO_2GB">GLO 2GB - ₦1,100</option><option value="GLO_3GB">GLO 3GB - ₦1,500</option><option value="GLO_5GB">GLO 5GB - ₦2,000</option></optgroup></select><button type="submit" class="btn btn-primary">Buy Data</button></form><div id="dataResult"></div>',
            airtime: '<form onsubmit="buyAirtime(event)"><input type="text" id="airtimePhone" value="' + phone + '" placeholder="Phone Number"><input type="number" id="airtimeAmount" placeholder="Amount (min ₦50)" min="50"><button type="submit" class="btn btn-primary">Buy Airtime</button></form><div id="airtimeResult"></div>',
            tv: '<form onsubmit="buyTV(event)"><input type="text" id="tvIuc" placeholder="Smart Card Number"><select id="tvService"><option value="90">DSTV Padi - ₦4,400</option><option value="91">DSTV Yanga - ₦6,000</option><option value="92">DSTV Confam - ₦11,000</option><option value="93">DSTV Compact - ₦19,000</option><option value="105">DSTV Compact Plus - ₦30,000</option><option value="94">GOTV Smallie - ₦1,900</option><option value="96">GOTV Jolli - ₦5,800</option><option value="97">GOTV Jinja - ₦3,900</option><option value="95">GOTV Max - ₦8,500</option></select><button type="submit" class="btn btn-primary">Subscribe</button></form><div id="tvResult"></div>',
            electricity: '<form onsubmit="buyElectricity(event)"><select id="elecService"><option value="1">IKEDC</option><option value="2">EKEDC</option><option value="3">KEDCO</option><option value="4">PHED</option><option value="5">JED</option><option value="6">IBEDC</option><option value="8">AEDC</option><option value="9">EEDC</option></select><input type="text" id="elecMeter" placeholder="Meter Number"><select id="elecType"><option value="1">Prepaid</option><option value="2">Postpaid</option></select><input type="number" id="elecAmount" placeholder="Amount"><button type="submit" class="btn btn-primary">Pay</button></form><div id="elecResult"></div>',
            education: '<form onsubmit="buyEducation(event)"><select id="eduService"><option value="1">WAEC - ₦5,250</option><option value="2">NECO - ₦2,250</option><option value="3">NABTEB - ₦900</option></select><input type="number" id="eduQuantity" value="1" min="1"><button type="submit" class="btn btn-primary">Buy Pin</button></form><div id="eduResult"></div>',
            fund: '<form onsubmit="fundWallet(event)"><div style="background:#e3f2fd;padding:12px;border-radius:8px;margin-bottom:12px;"><p style="font-size:13px;color:#555;margin:0;">💡 Enter email and amount to fund via Paystack</p></div><input type="email" id="fundEmail" placeholder="Email Address" required><input type="number" id="fundAmount" placeholder="Amount (min ₦100)" min="100" required><button type="submit" class="btn btn-success">💳 Pay with Paystack</button></form><div id="fundResult"></div>',
            withdraw: '<form onsubmit="withdrawProfit(event)"><div style="background:#fff3e0;padding:12px;border-radius:8px;margin-bottom:12px;"><p style="font-size:13px;color:#555;margin:0;">💰 Available: <strong>' + document.getElementById('profitDisplay').textContent + '</strong></p></div><input type="number" id="withdrawAmount" placeholder="Amount (min ₦100)" min="100" required><input type="text" id="withdrawBank" placeholder="Bank Name" required><input type="text" id="withdrawAccount" placeholder="Account Number" required><input type="text" id="withdrawName" placeholder="Account Name" required><button type="submit" class="btn btn-withdraw">💸 Request Withdrawal</button></form><div id="withdrawResult"></div>'
        };

        var titles = { data: '📱 Buy Data', airtime: '📞 Buy Airtime', tv: '📺 TV Subscription', electricity: '💡 Pay Electricity', education: '📚 Buy Exam Pins', fund: '💳 Fund Wallet', withdraw: '💸 Withdraw Profit' };
        t.textContent = titles[type] || 'Service';
        b.innerHTML = forms[type] || '<p>Invalid</p>';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
    document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

    // ============================================
    // BUY FUNCTIONS
    // ============================================
    function buyData(e) {
        e.preventDefault();
        var r = document.getElementById('dataResult');
        r.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
        fetch(API + '/api/buy-data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: document.getElementById('dataPhone').value,
                plan: document.getElementById('dataPlan').value
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Success! Profit: ₦' + (d.result.profit || 0) + '</div>';
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    function buyAirtime(e) {
        e.preventDefault();
        var r = document.getElementById('airtimeResult');
        var amt = document.getElementById('airtimeAmount').value;
        if (!amt || amt < 50) {
            r.innerHTML = '<div class="result-msg error">❌ Min ₦50</div>';
            return;
        }
        r.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
        fetch(API + '/api/buy-airtime', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: document.getElementById('airtimePhone').value,
                amount: Number(amt)
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Success! Profit: ₦' + (d.result.profit || 0) + '</div>';
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    function buyTV(e) {
        e.preventDefault();
        var r = document.getElementById('tvResult');
        var iuc = document.getElementById('tvIuc').value;
        if (!iuc) {
            r.innerHTML = '<div class="result-msg error">❌ Smart Card required</div>';
            return;
        }
        r.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
        fetch(API + '/api/buy-tv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phone,
                serviceID: document.getElementById('tvService').value,
                iucNum: iuc
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Subscribed!</div>';
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    function buyElectricity(e) {
        e.preventDefault();
        var r = document.getElementById('elecResult');
        var meter = document.getElementById('elecMeter').value;
        var amt = document.getElementById('elecAmount').value;
        if (!meter || !amt) {
            r.innerHTML = '<div class="result-msg error">❌ Meter and Amount required</div>';
            return;
        }
        r.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
        fetch(API + '/api/buy-electricity', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phone,
                serviceID: document.getElementById('elecService').value,
                meterNum: meter,
                meterType: Number(document.getElementById('elecType').value),
                amount: Number(amt)
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Paid!</div>';
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    function buyEducation(e) {
        e.preventDefault();
        var r = document.getElementById('eduResult');
        r.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
        fetch(API + '/api/buy-education', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phone,
                serviceID: document.getElementById('eduService').value,
                quantity: Number(document.getElementById('eduQuantity').value)
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Pin purchased!</div>';
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    function fundWallet(e) {
        e.preventDefault();
        var r = document.getElementById('fundResult');
        var email = document.getElementById('fundEmail').value;
        var amt = document.getElementById('fundAmount').value;
        if (!email) {
            r.innerHTML = '<div class="result-msg error">❌ Email required</div>';
            return;
        }
        if (!amt || amt < 100) {
            r.innerHTML = '<div class="result-msg error">❌ Min ₦100</div>';
            return;
        }
        r.innerHTML = '<div class="result-msg loading">⏳ Initializing...</div>';
        fetch(API + '/api/fund-wallet-paystack', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                amount: Number(amt),
                phone: phone
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Redirecting...</div>';
                window.open(d.authorization_url, '_blank');
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    function withdrawProfit(e) {
        e.preventDefault();
        var r = document.getElementById('withdrawResult');
        var amt = document.getElementById('withdrawAmount').value;
        var bank = document.getElementById('withdrawBank').value;
        var acc = document.getElementById('withdrawAccount').value;
        var name = document.getElementById('withdrawName').value;
        if (!amt || amt < 100) {
            r.innerHTML = '<div class="result-msg error">❌ Min ₦100</div>';
            return;
        }
        if (!bank || !acc || !name) {
            r.innerHTML = '<div class="result-msg error">❌ All details required</div>';
            return;
        }
        r.innerHTML = '<div class="result-msg loading">⏳ Processing...</div>';
        fetch(API + '/api/withdraw-profit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phone,
                amount: Number(amt),
                bankName: bank,
                accountNumber: acc,
                accountName: name
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(d) {
            if (d.success) {
                r.innerHTML = '<div class="result-msg success">✅ Request submitted!</div>';
                setTimeout(function() { closeModal(); loadData(); }, 2000);
            } else {
                r.innerHTML = '<div class="result-msg error">❌ ' + (d.error || 'Failed') + '</div>';
            }
        })
        .catch(function() { r.innerHTML = '<div class="result-msg error">❌ Connection error</div>'; });
    }

    // ============================================
    // LOGOUT - SIMPLE
    // ============================================
    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = '/';
    });

    // ============================================
    // LOAD DATA
    // ============================================
    loadData();

})();
</script>
</body>
</html>
